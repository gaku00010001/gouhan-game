<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合板ファクトリー</title>
<style>
:root{
  --bg:#f4ecdf; --card:#fffaf2; --ink:#3a2817; --muted:#8a735a; --line:#e3d3bb;
  --wood:#d9a866; --wood-l:#f0d49a; --accent:#c8551f; --accent-d:#a4400f;
  --ok:#3f8f4a; --ng:#c0392b; --warn:#c88a12; --zone:rgba(63,143,74,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;line-height:1.6;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{max-width:760px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
header h1{font-size:1.3rem;margin:0;flex:1;white-space:nowrap}
#total{font-weight:700;color:var(--accent);font-size:.9rem}
.gbtn{padding:6px 12px;background:var(--wood-l);font-weight:700;font-size:.9rem;box-shadow:0 2px 0 #c9a066}
#steps{display:flex;gap:4px;width:100%;overflow-x:auto}
.step{flex:1;min-width:58px;text-align:center;padding:4px 2px;border-radius:8px;background:#eadcc6;font-size:1.1rem;opacity:.55}
.step small{display:block;font-size:.62rem;line-height:1.2}
.step.now{opacity:1;background:var(--wood-l);outline:2px solid var(--accent)}
.step.done{opacity:1;background:#d7e8d2}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 14px rgba(80,50,20,.08)}
h2{margin:0 0 10px;font-size:1.4rem}
h3{margin:16px 0 6px;font-size:1.05rem}
.yomi{font-size:.8rem;color:var(--muted);margin-left:8px;font-weight:400}
.stage-no{color:var(--muted);font-size:.85rem}
.fact,.how,.pts{border-radius:12px;padding:10px 14px;margin:10px 0}
.fact{background:#f3e6d0}.how{background:#e7efe0}.pts{background:#eef0f7}
.fact p,.how p{margin:4px 0 0}
.pts ul{margin:4px 0 0;padding-left:1.2em}
.note{font-size:.78rem;color:var(--muted)}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;color:var(--ink)}
.big{display:block;width:100%;padding:16px;margin-top:14px;font-size:1.15rem;font-weight:700;color:#fff;background:var(--accent);box-shadow:0 4px 0 var(--accent-d);touch-action:manipulation}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.big:disabled{opacity:.45;cursor:default}
.msg{margin-top:10px;padding:8px 12px;background:#f3e6d0;border-radius:10px;font-size:.92rem;min-height:2.4em}
.hud{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin:6px 0;flex-wrap:wrap}
.cv{width:100%;height:auto;display:block;border-radius:12px;background:#2b2420;touch-action:none}
.cv.scr{background:#cdb89a;cursor:crosshair}
/* 注文 */
.orders{display:grid;gap:10px;margin:12px 0}
.order{text-align:left;padding:12px 14px;background:#fff;border:2px solid var(--line);border-radius:14px}
.order:hover{border-color:var(--accent)}
.order b{font-size:1.05rem}
.order small{display:block;color:var(--muted)}
.osheet{border:2px dashed var(--wood);border-radius:12px;padding:8px 12px;background:#fff;font-size:.9rem;margin:8px 0}
.osheet b{color:var(--accent)}
/* 玉切り */
.ruler{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);padding:0 2px}
.logbox{padding:18px 0 8px}
.log{position:relative;height:90px;border-radius:45px;background:repeating-linear-gradient(0deg,#6b4527 0 6px,#5a3920 6px 9px,#7a5030 9px 15px);border:3px solid #4a2f1a}
.mark{position:absolute;top:-14px;bottom:-14px;width:4px;margin-left:-2px;background:rgba(200,40,30,.35);border-radius:2px}
.mark.active{background:#e02b20;box-shadow:0 0 8px #e02b20}
.saw{position:absolute;top:-22px;bottom:-22px;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 0 1px #333}
.saw span{position:absolute;top:-26px;left:-12px;font-size:22px}
.cutline{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--bg)}
/* ゲージ */
.gauge{position:relative;height:34px;border-radius:10px;background:#eadcc6;margin-top:12px;overflow:hidden}
.gauge .zone{position:absolute;top:0;bottom:0;background:var(--zone);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.gauge .needle{position:absolute;top:0;bottom:0;width:5px;margin-left:-2.5px;background:var(--accent)}
.gauge span{position:absolute;bottom:2px;font-size:.7rem;color:var(--muted)}
.gl{left:6px}.gr{right:6px}.gm{left:50%;transform:translateX(-50%);top:2px;bottom:auto!important;color:var(--ok)!important;font-weight:700;white-space:nowrap}
/* 乾燥 */
.dryer{position:relative;height:120px;border-radius:12px;background:#3a3330;overflow:hidden}
.oven{position:absolute;left:22%;right:22%;top:10px;bottom:28px;background:linear-gradient(#b8452a,#7d2b1c);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffd9b0;z-index:2;opacity:.92}
.heat{font-size:1.4rem;animation:wav 1s infinite alternate}
@keyframes wav{to{transform:translateY(-5px)}}
.belt{position:absolute;left:0;right:0;bottom:16px;height:6px;background:repeating-linear-gradient(90deg,#777 0 10px,#555 10px 20px)}
.sheet{position:absolute;bottom:22px;width:24%;height:10px;border-radius:2px;left:0;animation:slide 3s linear infinite;z-index:1}
@keyframes slide{from{left:-25%}to{left:100%}}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:520px){.meters{grid-template-columns:1fr}}
.meters>div{background:#f3e6d0;border-radius:12px;padding:10px}
.lbl{font-size:.85rem;color:var(--muted)}
.num{font-size:2rem;font-weight:800}
.num.good{color:var(--ok)}
.bar{position:relative;height:14px;background:#e0cfb3;border-radius:7px;overflow:hidden;margin:4px 0}
.bar .fill{height:100%;background:#5b8fc7}
.bar .risk{background:var(--ng)}
.bar .tz{position:absolute;top:0;bottom:0;left:11.43%;width:5.71%;background:var(--zone);border:1px solid var(--ok)}
.sub{font-size:.8rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.tctl{background:#f3e6d0;border-radius:12px;padding:10px;margin-top:10px}
.drows{display:grid;gap:8px;margin-top:10px}
.drow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:#f3e6d0;border-radius:12px;padding:8px 10px}
.drow .dn{font-weight:800;font-size:.85rem}
.drow .num{font-size:1.4rem;line-height:1.1}
.drow .num.over{color:var(--ng)}
.drow .bar.rk{height:5px;margin-top:2px}
.drow .out{padding:10px 12px;font-weight:700;background:var(--wood-l);box-shadow:0 3px 0 #c9a066}
.drow.done{opacity:.55}
/* 選別 */
.vstage{position:relative;padding:10px 0}
.veneer{position:relative;height:190px;border-radius:6px;background:repeating-linear-gradient(0deg,#efcf96 0 7px,#e6c083 7px 9px,#f2d6a2 9px 16px,#e3bb7c 16px 17px);box-shadow:0 3px 8px rgba(0,0,0,.2)}
.veneer.in{animation:pop .25s}
@keyframes pop{from{transform:translateX(40px);opacity:0}}
.knot{position:absolute;border-radius:50%;background:radial-gradient(#5b3518 30%,#8a5528 60%,transparent 72%)}
.crack{position:absolute;height:4px;background:#3b2210;border-radius:2px;box-shadow:0 0 0 1px #6b4423}
.hole{position:absolute;width:38px;height:32px;border-radius:50%;background:radial-gradient(#1d120a 55%,#6b4423 70%,transparent 75%)}
.judge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5rem;font-weight:900;pointer-events:none}
.line{position:relative;height:190px;margin:8px 0 10px;border-radius:12px;overflow:hidden;background:
  repeating-linear-gradient(90deg,#5a524c 0 18px,#4a433e 18px 36px);box-shadow:inset 0 -10px 0 #333,inset 0 10px 0 #333}
.endzone{position:absolute;left:0;top:0;bottom:0;width:7%;background:rgba(200,40,30,.35);color:#fff;font-size:.65rem;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;z-index:3}
.vsheet{position:absolute;top:20px;height:150px;width:34%;transition:transform .5s,opacity .5s}
.vsheet .veneer{height:100%}
.vsheet.target .veneer{box-shadow:0 0 0 4px #ffd34d,0 0 16px 4px #ffd34d}
.vsheet .judge{font-size:3.6rem}
.vsheet.to-A{transform:translateY(-130%);opacity:0}.vsheet.to-B{transform:translateY(130%);opacity:0}
.vsheet.to-F{transform:translateY(130%) rotate(25deg);opacity:0}.vsheet.to-miss{transform:translateX(-70%);opacity:0}
.tone{position:absolute;left:0;right:0;background:rgba(170,110,50,.18)}
.rot{position:absolute;width:70px;height:46px;border-radius:45%;background:radial-gradient(#4b3a2a 30%,#6e5a44 60%,transparent 72%);opacity:.85}
.patch{position:absolute;width:38px;height:32px;border-radius:50%;background:#f2d29b;box-shadow:0 0 0 2px #b98445}
.hole{cursor:pointer}
.hole::after{content:"🩹";position:absolute;right:-14px;top:-14px;font-size:16px}
kbd{display:inline-block;margin-left:4px;padding:0 5px;border:1px solid #b9935a;border-radius:4px;font-size:.7rem;background:#fff6e2}
@media (hover:none){kbd{display:none}}
.sort-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sort-btns button{padding:12px 4px;font-weight:700;background:var(--wood-l);box-shadow:0 3px 0 #c9a066}
.sort-btns small{font-weight:400;font-size:.75rem}
/* 組み立て */
.layer{display:grid;grid-template-columns:70px 1fr auto auto;gap:8px;align-items:center;margin:6px 0}
.ln{font-size:.8rem;line-height:1.2;text-align:center}
.ln small{color:var(--muted)}
.strip{height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:#5b3a1c;transition:.2s}
.strip.h{background:repeating-linear-gradient(0deg,#efcf96 0 5px,#d9a866 5px 7px)}
.strip.v{background:repeating-linear-gradient(90deg,#e8c48a 0 5px,#c99555 5px 7px)}
.strip.glued{box-shadow:0 0 0 3px #f6f1c8,0 0 12px 3px #e9e08a}
.strip span{background:rgba(255,250,242,.85);padding:0 8px;border-radius:8px}
.layer button{padding:9px;background:#eadcc6;font-weight:700}
.layer button.on{background:#f1e48a}
.answer{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff;border:2px solid var(--line)}
.answer h3{margin:0 0 6px}
.answer p{margin:6px 0 0;font-size:.9rem}
.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans-grid>div>b{display:block;text-align:center;margin-bottom:2px}
.arow{display:grid;grid-template-columns:52px 1fr 22px;gap:6px;align-items:center;margin:4px 0}
.ans-grid>div:last-child .arow{grid-template-columns:52px 1fr}
.arow .strip{height:32px}
/* 仕上げ・検査 */
.ipanel{position:relative;height:260px;border-radius:4px;touch-action:none;cursor:pointer;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.25);
  background:radial-gradient(ellipse 30% 12% at 30% 40%,rgba(180,120,60,.18),transparent),radial-gradient(ellipse 25% 10% at 75% 70%,rgba(150,95,45,.15),transparent),
  repeating-linear-gradient(0deg,#f3d9a8 0 7px,#ebcb92 7px 9px,#f6dfb2 9px 15px,#e6c287 15px 16px)}
.spot.found{box-shadow:0 0 0 3px var(--ok)}
.spot.missed{box-shadow:0 0 0 3px var(--ng)}
.spot .tag{position:absolute;top:100%;white-space:nowrap;font-size:.72rem;font-weight:700;background:#fff;padding:0 6px;border-radius:6px;pointer-events:none;z-index:2}
.spot.missed .tag{color:var(--ng)}
.miss{position:absolute;transform:translate(-50%,-50%);color:var(--ng);font-size:1.3rem;pointer-events:none}
.spot{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ipanel.in{animation:pop .35s}
.d-pank{width:30px;height:23px;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#f8e4bd 25%,#ecca93 60%,transparent 74%);box-shadow:1px 2px 3px rgba(90,55,20,.22)}
.d-peel{width:40px;height:8px;background:linear-gradient(#f3d9a8 45%,#7a5530 45%,#7a5530 62%,#d4a76a 62%);transform:rotate(-2deg);border-radius:2px;opacity:.85}
.d-crack,.d-chip{display:block;line-height:0}
.d-hole{width:11px;height:9px;border-radius:50%;background:radial-gradient(#3b2414 50%,#7a5530 70%,transparent 76%)}
.spot.corner{margin:0;border-radius:0;width:44px;height:44px}
.c-tl{left:0;top:0;align-items:flex-start;justify-content:flex-start}
.c-tr{right:0;top:0;align-items:flex-start;justify-content:flex-end}
.c-bl{left:0;bottom:0;align-items:flex-end;justify-content:flex-start}
.c-br{right:0;bottom:0;align-items:flex-end;justify-content:flex-end}
.c-tr svg{transform:scaleX(-1)}.c-bl svg{transform:scaleY(-1)}.c-br svg{transform:scale(-1,-1)}
.c-bl .tag,.c-br .tag{top:auto;bottom:100%}.c-tr .tag,.c-br .tag{right:0}
.d-rough{width:44px;height:30px;border-radius:40%;opacity:.5;background:radial-gradient(#a08a6e 1px,transparent 1.5px) 0 0/5px 5px,radial-gradient(#8e7658 1px,transparent 1.5px) 2px 3px/6px 6px}
.decoy{position:absolute;transform:translate(-50%,-50%)}
.dk-tone{width:90px;height:34px;border-radius:50%;background:radial-gradient(ellipse,rgba(170,110,50,.22),transparent 70%)}
.dk-streak{width:70px;height:5px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(130,85,40,.38),transparent);filter:blur(.6px)}
.dk-spot{width:26px;height:20px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,240,210,.75),transparent 70%)}
.jbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.jbtns button{padding:12px 4px;font-weight:800;font-size:1.05rem;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.jbtns small{font-weight:400;font-size:.75rem}
.okb{background:#d7e8d2}.ngb{background:#f4d0cb}
.glues{display:grid;gap:6px}
.glues button{text-align:left;padding:8px 12px;background:#fff;border:2px solid var(--line)}
.glues button.on{border-color:var(--accent);background:#fff3dc}
.glues small{display:block;color:var(--muted);font-size:.78rem}
/* 熱圧 */
.press{position:relative;height:150px;background:#3a3330;border-radius:12px;overflow:hidden}
.plate{position:absolute;left:12%;right:12%;height:34px;background:linear-gradient(#9aa3ad,#6d757e);border-radius:4px}
.plate.top{top:8px}.plate.bot{bottom:14px}
.pboard{position:absolute;left:16%;right:16%;bottom:48px;height:30px;background:repeating-linear-gradient(0deg,#efcf96 0 6px,#c99555 6px 7px);border-radius:2px}
.steam{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:1.6rem;opacity:0;transition:.3s}
.progress{height:16px;background:#e0cfb3;border-radius:8px;overflow:hidden;margin-top:8px}
.progress div{height:100%;width:0;background:var(--ok)}
.pcv{cursor:ns-resize}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pbtns button{padding:14px;font-weight:800;font-size:1.05rem;background:var(--wood-l);box-shadow:0 3px 0 #c9a066;touch-action:none}
/* 結果・クイズ */
.result{margin-top:14px;padding:14px;border-radius:12px;background:#fff3dc;border:2px solid var(--wood);animation:pop .3s}
.result .head{text-align:center}
.result .sc{font-size:2.4rem;font-weight:900;color:var(--accent);line-height:1.2}
.stars{font-size:1.6rem;letter-spacing:4px}
.quiz{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff;border:2px solid #b9c6e4}
.quiz p{margin:4px 0 8px;font-weight:700}
.choices{display:grid;gap:6px}
.choices button{text-align:left;padding:10px 12px;background:#eef0f7}
.choices button.right{background:#cfe8cc;outline:2px solid var(--ok)}
.choices button.wrong{background:#f4d0cb;outline:2px solid var(--ng)}
.exp{margin-top:8px;font-size:.92rem}
.count{text-align:center;padding:50px 0;color:var(--accent)}
.count small{display:block;color:var(--muted);font-size:1rem}
.count b{display:block;font-size:5rem;line-height:1.1;animation:pop .3s}
/* タイトル・最終 */
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;align-items:center}
.flow span{background:var(--wood-l);border-radius:20px;padding:3px 10px;font-size:.82rem}
.flow span.sub2{background:#eadcc6;color:var(--muted)}
.ply{margin:16px auto;width:min(320px,90%)}
.ply div{height:16px;border:1px solid rgba(80,50,20,.25)}
.ply div:nth-child(odd){background:repeating-linear-gradient(0deg,#f2d6a2 0 4px,#d9a866 4px 5px)}
.ply div:nth-child(even){background:repeating-linear-gradient(90deg,#e8c48a 0 4px,#b98445 4px 6px)}
.rank{font-size:3.4rem;font-weight:900;color:var(--accent);text-align:center;line-height:1}
.title-rank{text-align:center;font-weight:700;margin-bottom:8px}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:.9rem}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.b{width:40%}
.mini{height:10px;background:#e0cfb3;border-radius:5px;overflow:hidden;margin-top:6px}
.mini div{height:100%;background:var(--wood)}
.verdict{font-size:1.3rem;font-weight:900;text-align:center;padding:8px;border-radius:10px;margin:8px 0}
.v-ok{background:#d7e8d2;color:var(--ok)}.v-warn{background:#f7e8c4;color:#8a5d00}.v-ng{background:#f4d0cb;color:var(--ng)}
.review{background:#fff;border-left:4px solid var(--ng);padding:8px 12px;margin:6px 0;border-radius:6px;font-size:.9rem}
/* 用語集 */
.modal{position:fixed;inset:0;background:rgba(40,25,10,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{max-height:85vh;overflow:auto;width:min(680px,100%);-webkit-user-select:text;user-select:text}
.modal input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font:inherit;margin-bottom:8px}
dl{margin:0}dt{font-weight:800;margin-top:10px}dt small{color:var(--muted);font-weight:400;margin-left:6px}dd{margin:2px 0 0 0;font-size:.92rem}
.modal h3{margin:14px 0 4px;color:var(--accent)}
.modal .gbtn{margin:4px 0 8px}
.big.sub{background:#eadcc6;color:var(--ink);box-shadow:0 4px 0 #c9a066}
.wsel{display:flex;flex-wrap:wrap;gap:6px}
.wsel button{padding:8px 12px;background:#fff;border:2px solid var(--line);font-size:.9rem}
.wsel button.on{border-color:var(--accent);background:#fff3dc;font-weight:700}
.wq{font-size:1.15rem;font-weight:700;margin:12px 0;padding:14px;background:#fff;border-radius:12px;border:2px solid #b9c6e4;line-height:1.6}
.wa{width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);font:inherit;font-size:1.05rem}
.wa:focus{outline:none;border-color:var(--accent)}
.wbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wres{margin-top:12px;padding:10px 14px;border-radius:12px;background:#fff;font-weight:700}
.wres.ok{background:#d7e8d2;color:var(--ok)}.wres.ng{background:#f4d0cb;color:var(--ng)}
.wans{color:var(--ink);font-weight:400;margin-top:4px;font-size:1.05rem}
.wans b{font-size:1.25rem}
</style>
</head>
<body>
<div id="app">
  <header><h1>🪵 合板ファクトリー</h1><span id="total"></span><button class="gbtn" id="gloss">📖 用語集</button><div id="steps"></div></header>
  <main id="screen"></main>
</div>
<script>
/* ===== ユーティリティ ===== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const screen=document.getElementById('screen'),stepsEl=document.getElementById('steps'),totalEl=document.getElementById('total');
let cleanups=[];
const addCleanup=f=>cleanups.push(f);
const runCleanups=()=>{cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[]};
function loop(fn){let last=performance.now(),run=true,id;
  const f=now=>{if(!run)return;const dt=Math.min(.05,(now-last)/1000);last=now;if(fn(dt)===false){run=false;return}id=requestAnimationFrame(f)};
  id=requestAnimationFrame(f);const stop=()=>{run=false;cancelAnimationFrame(id)};addCleanup(stop);return stop}
function onKey(down,up){
  const d=e=>{if(e.code!=='Space'||document.querySelector('.modal'))return;e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();if(!e.repeat&&down)down()};
  const u=e=>{if(e.code!=='Space')return;e.preventDefault();if(up)up()};
  addEventListener('keydown',d);addEventListener('keyup',u);
  addCleanup(()=>{removeEventListener('keydown',d);removeEventListener('keyup',u)})}
let actx;
function beep(f=600,d=.08,type='sine',vol=.05){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(actx.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d)}catch(e){}}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function grain(ctx,W,H,base,line){ctx.fillStyle=base;ctx.fillRect(0,0,W,H);ctx.strokeStyle=line;ctx.lineWidth=1.5;
  for(let y=6;y<H;y+=11){ctx.beginPath();for(let x=0;x<=W;x+=16){const yy=y+Math.sin(x/70+y)*3;x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}ctx.stroke()}}

/* ===== 汎用：こすりゲーム（剥皮・研磨） ===== */
function scratch(area,o,done){
  const W=640,H=240,cols=40,rows=15,cw=W/cols,ch=H/rows;
  area.innerHTML=`<div class="hud"><span class="tm"></span><span class="pc"></span></div>
  <canvas class="cv scr" width="${W}" height="${H}"></canvas><div class="msg">${o.msg}</div>`;
  const cv=area.querySelector('canvas'),ctx=cv.getContext('2d'),tm=area.querySelector('.tm'),pc=area.querySelector('.pc');
  // hp>1 のセルは、間をあけて何回かこすらないと消えない（厚い樹皮）
  const hp=o.hp||1,cells=[];
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const v=o.cell(i,j);cells.push({i,j,on:true,hp,t:0,over:0,dmg:false,c:v.c||v,c2:v.c2||v.c||v})}
  let cleared=0,dmg=0,warn=0,t=o.time,started=false,down=false,last=null;
  // o.damage のとき：皮がむけた所をさらに何度もこすると、丸太（木部）が傷つく
  const OVER=4;
  const rub=(x,y)=>{const now=performance.now();for(const c of cells){const dx=(c.i+.5)*cw-x,dy=(c.j+.5)*ch-y;
    if(dx*dx+dy*dy>=900||now-c.t<=180)continue;c.t=now;
    if(c.on){if(--c.hp<=0){c.on=false;cleared++}}
    else if(o.damage&&!c.dmg&&++c.over>=OVER){c.dmg=true;dmg++;warn=1.2;beep(150,.08,'square',.03)}}};
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();down=true;started=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}last=pos(e);rub(...last)});
  cv.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e),dx=p[0]-last[0],dy=p[1]-last[1],n=Math.ceil(Math.hypot(dx,dy)/10)||1;
    for(let k=1;k<=n;k++)rub(last[0]+dx*k/n,last[1]+dy*k/n);last=p;if(Math.random()<.3)beep(o.tone+Math.random()*80,.03,'sawtooth',.012)});
  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>down=false));
  loop(dt=>{
    if(started)t-=dt;
    ctx.clearRect(0,0,W,H);ctx.save();rr(ctx,4,4,W-8,H-8,o.radius);ctx.clip();o.bg(ctx,W,H);
    for(const c of cells){const x=c.i*cw,y=c.j*ch;
      if(c.on){ctx.fillStyle=c.hp<hp?c.c2:c.c;ctx.fillRect(x,y,cw+.6,ch+.6)}
      // こすりすぎの予告（だんだん色が濃くなる）→ 傷（えぐれ）
      else if(c.dmg){ctx.fillStyle='#8a4a22';ctx.fillRect(x,y,cw+.6,ch+.6);ctx.fillStyle='rgba(60,25,8,.6)';ctx.fillRect(x,y+ch*.35,cw+.6,ch*.3)}
      else if(c.over>=2){ctx.fillStyle=`rgba(160,80,30,${c.over>=3?.45:.22})`;ctx.fillRect(x,y,cw+.6,ch+.6)}}
    ctx.restore();warn-=dt;
    if(warn>0){ctx.fillStyle='#fff3c4';ctx.font='bold 20px sans-serif';ctx.fillText('⚠ こすりすぎ！ 丸太が傷ついた',150,40)}
    const r=cleared/cells.length,pen=Math.min(50,dmg/cells.length*200);
    tm.textContent=started?`残り ${Math.max(0,t).toFixed(1)}秒`:`こすったらスタート（${o.time}秒）`;
    pc.textContent=`${o.label} ${Math.round(r*100)}%${o.damage?`　傷 ${dmg}か所`:''}`;
    if(t<=0||r>=1){done(Math.min(100,r*104)-pen,`${o.label}できた割合：${Math.round(r*100)}%${dmg?`・こすりすぎの傷 ${dmg}か所（-${Math.round(pen)}点）`:''}`);return false}
  });
}

function playCut(area,done){
  const cf=V(),L=cf.log,T=cf.cuts.map(m=>m/L*100),N=T.length;
  area.innerHTML=`<div class="ruler">${Array.from({length:L/2+1},(_,k)=>`<span>${k*2}m</span>`).join('')}</div>
  <div class="logbox"><div class="log">${T.map(p=>`<div class="mark" style="left:${p}%"></div>`).join('')}<div class="saw"><span>🪚</span></div></div></div>
  <div class="msg">長さ${L}mの原木を、約2mずつに切り分けます。赤く光る印にノコが重なった瞬間に「切る！」（${N}回）。</div>
  <button class="big act">🪚 切る！（スペースキーでもOK）</button>`;
  const log=area.querySelector('.log'),saw=area.querySelector('.saw'),marks=[...area.querySelectorAll('.mark')],msg=area.querySelector('.msg');
  // 速さは「1秒に動くm数」をそろえるため、原木の長さで割合に換算する
  let k=0,x=0,dir=1,speed=cf.saw*8/L;const res=[],errs=[];marks[0].classList.add('active');
  loop(dt=>{x+=dir*speed*dt;if(x>100){x=100;dir=-1}if(x<0){x=0;dir=1}saw.style.left=x+'%'});
  function cut(){if(k>=N)return;const cm=Math.round(Math.abs(x-T[k])*L);errs.push(cm);res.push(Math.max(0,100-cm*2));
    log.insertAdjacentHTML('beforeend',`<div class="cutline" style="left:${x}%"></div>`);marks[k].classList.remove('active');
    msg.textContent=(cm<=4?'🎯 ぴったり！':cm<=15?'👍 いいね！':'😅 ずれた…短すぎると製品の寸法が取れず、長すぎると材料のムダに。')+` 誤差 ${cm}cm`;
    beep(cm<=4?880:cm<=15?660:300,.12,'triangle');
    k++;speed+=cf.sawUp*8/L;if(k<N)marks[k].classList.add('active');
    else{runCleanups();setTimeout(()=>done(res.reduce((a,b)=>a+b)/N,`誤差：${errs.join('cm / ')}cm`),500)}}
  area.querySelector('.act').onclick=cut;onKey(cut);
}

function playDebark(area,done){
  const cf=V(),R=Math.random;
  // 樹皮の見た目：stripe＝細長くはがれる／thick＝厚くうろこ状（2回で外皮→内皮→木部）／thin＝薄く灰色がかった皮
  const cell={
    stripe:(i,j)=>`hsl(${18+R()*10},${30+R()*15}%,${(j%3?20:13)+R()*12}%)`,
    thick:(i,j)=>({c:`hsl(${22+R()*8},${18+R()*10}%,${((i>>1)+j*2)%5?17:10}%)`,c2:`hsl(${12+R()*8},${45+R()*10}%,${34+R()*8}%)`}),
    thin:(i,j)=>`hsl(${28+R()*8},${12+R()*10}%,${38+R()*14}%)`,
  }[cf.bark];
  scratch(area,{time:cf.barkTime,label:'皮むき',radius:60,tone:120,hp:cf.barkHp,damage:true,
    msg:(cf.barkHp>1?'厚い樹皮は、1回こすると赤っぽい内皮が出てきます。もう一度こすってはがそう！ ':'丸太をなぞって（ドラッグ）樹皮をはがそう！ ')+'樹皮が残ると刃が傷みますが、皮がむけた所を何度もこすると丸太が傷ついて減点！（色が濃くなったら要注意）',
    bg:(c,W,H)=>grain(c,W,H,'#ecca8f','rgba(170,110,50,.35)'),cell},done);
}

function playPeel(area,done){
  const vt=G.order.vt,cf=V(),zw=cf.peelZone,lo=52-zw/2,hi=52+zw/2;
  area.innerHTML=`<div class="osheet">📋 この注文の単板の厚さの目安：<b>約${vt}mm</b>（${G.order.spec.split('・')[0]}を${G.order.ply}枚で構成）</div>
  <canvas class="cv" width="640" height="260"></canvas>
  <div class="gauge"><div class="zone" style="left:${lo}%;width:${zw}%"></div><div class="needle"></div><span class="gl">うすい</span><span class="gm">目標 ${vt}mm 前後</span><span class="gr">あつい</span></div>
  <div class="hud"><span class="tm"></span><span class="th"></span><span class="pc"></span></div>
  <button class="big act">🔪 長押しで刃を押し当てる（スペース長押しもOK）</button>`;
  const cv=area.querySelector('canvas'),ctx=cv.getContext('2d'),nd=area.querySelector('.needle'),tm=area.querySelector('.tm'),th=area.querySelector('.th'),pc=area.querySelector('.pc'),act=area.querySelector('.act');
  // 刃の当たり具合は目標ゾーンの中央から始める（始まりから点数が取れるように）
  let hold=false,v=52,t=0,inZ=0,ang=0,nextKnot=1.5+Math.random(),knotFlash=0;const T=10,segs=[];
  // 最初にボタンを押すまでは時間も針も止めておく
  let started=false;const on=()=>{hold=true;started=true},off=()=>hold=false;
  act.addEventListener('pointerdown',e=>{e.preventDefault();on()});['pointerup','pointerleave','pointercancel'].forEach(ev=>act.addEventListener(ev,off));
  act.addEventListener('contextmenu',e=>e.preventDefault());onKey(on,off);
  loop(dt=>{
    if(!started)dt=0;
    t+=dt;const drift=(Math.sin(t*1.1)*14+Math.sin(t*2.1+1)*4)*cf.drift;// ゆっくりした波で、押したときの反応が急に変わらないようにする
    // 節の多い原木：ときどき刃が節に当たって厚さが急に乱れる
    if(cf.knotHits&&t>nextKnot){v+=(Math.random()<.5?-1:1)*(12+Math.random()*6);nextKnot=t+1.2+Math.random()*1.2;knotFlash=.6;beep(140,.12,'square',.04)}
    knotFlash-=dt;
    // 最初の1.5秒は針の動きをゆっくり立ち上げ、操作に慣れる時間をつくる
    const ease=Math.min(1,t/1.5);
    v=clamp(v+((hold?45:-40)+drift)*dt*ease,0,100);const ok=v>=lo&&v<=hi;if(ok)inZ+=dt;
    ang+=3.5*dt;const r=100-70*Math.min(1,t/T);
    segs.unshift({w:170*dt,ok,h:3+v/100*14});if(segs.length>800)segs.pop();
    const cx=170,cy=118,y=cy+r;
    ctx.fillStyle='#2b2420';ctx.fillRect(0,0,640,260);
    let x=cx;for(const s of segs){ctx.fillStyle=s.ok?'#f2d29b':'#e07a5f';ctx.fillRect(x,y-s.h,s.w+.6,s.h);x+=s.w;if(x>640)break}
    ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
    ctx.fillStyle='#dcae6e';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(120,70,30,.4)';ctx.lineWidth=2;for(let r2=14;r2<r;r2+=13){ctx.beginPath();ctx.arc(0,0,r2,0,Math.PI*2);ctx.stroke()}
    ctx.strokeStyle='rgba(90,50,20,.5)';for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(0,0);const a=k*2.1;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);ctx.stroke()}
    ctx.fillStyle='#666';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.fillStyle='#9aa3ad';ctx.beginPath();ctx.moveTo(cx-6,y+1);ctx.lineTo(cx+70,y+1);ctx.lineTo(cx+70,y+22);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ccc';ctx.font='14px sans-serif';ctx.fillText('単板（ベニヤ）→',430,y-24);
    if(t>T-2){ctx.fillStyle='#fff';ctx.fillText('残った芯＝剥き芯',cx-50,cy-r-10)}
    if(knotFlash>0){ctx.fillStyle='#ffcf5a';ctx.font='bold 22px sans-serif';ctx.fillText('ガツン！ 節に当たった！',330,40)}
    nd.style.left=v+'%';tm.textContent=started?`残り ${Math.max(0,T-t).toFixed(1)}秒`:`ボタンを押したらスタート（${T}秒）`;th.textContent=`いまの厚さ ${(vt*(.5+v/100)).toFixed(1)}mm`;pc.textContent=`良品率 ${t?Math.round(inZ/t*100):100}%`;
    if(t>=T){done(inZ/T*100,`目標の厚さで剥けた時間：${inZ.toFixed(1)}秒 / ${T}秒`);return false}
  });
}

function playDry(area,done){
  // 水分量のちがう単板3枚を、1つの温度設定で同時に乾かし、1枚ずつ取り出す。
  // 温度はつまみを動かしてもゆっくり追いつき、乾燥の後半は水分が抜けにくくなる
  const cf=V(),CT=cf.crackT,names=['上段','中段','下段'];
  const offs=shuffle([-8,0,10]),rates=shuffle([.85,1,1.15]);
  const S=names.map((n,k)=>({n,m:cf.dryStart+offs[k]+(Math.random()-.5)*4,rate:rates[k],out:false,crack:0}));
  S.forEach(s=>s.m0=s.m);const M0=Math.max(...S.map(s=>s.m0));
  area.innerHTML=`<div class="dryer"><div class="belt"></div><div class="oven"><span class="heat">♨ ♨ ♨</span><small>ドライヤー（熱風乾燥）</small></div><div class="sheet"></div></div>
  <div class="tctl"><div class="lbl">温度　設定 <b class="tv">140</b>℃ ／ いまの温度 <b class="ta">140</b>℃</div><input type="range" class="temp" min="100" max="180" value="140">
    <div class="sub">温度はゆっくり追いつきます。含水率30%以下の単板は、${CT}℃を超えると割れやすくなります（湿っているうちは高温でもOK）。</div></div>
  <div class="drows">${S.map((s,k)=>`<div class="drow" data-k="${k}"><span class="dn">${s.n}</span>
    <div><div class="num mo">${s.m.toFixed(1)}%</div><div class="bar"><div class="fill mf"></div><div class="tz" style="left:${8/M0*100}%;width:${4/M0*100}%"></div></div><div class="bar rk"><div class="fill risk" style="width:0"></div></div></div>
    <button class="out">📤 取り出す<kbd>${k+1}</kbd></button></div>`).join('')}</div>
  <div class="msg">3枚の単板は、それぞれ水分量と乾きやすさがちがいます。含水率8〜12%（10%がベスト）になったものから取り出そう！ 速く仕上げるほどボーナスあり。湿っているうちは高温で、乾いてきたら温度を下げるのがコツ。</div>`;
  const g=s=>area.querySelector(s),temp=g('.temp'),tv=g('.tv'),ta=g('.ta'),sheet=g('.sheet'),msg=g('.msg'),rows=[...area.querySelectorAll('.drow')];
  let T=140,t=0,fin=false;
  // 早さボーナスの基準：湿っているうちは180℃、乾いてきたら割れない温度に下げたときの時間
  const ref=((M0-30)/(90*.06)+20/((CT-90)*.06*.85))/(cf.dryRate*.85);
  const take=k=>{const s=S[k];if(s.out||fin)return;s.out=true;s.t=t;const r=rows[k];r.classList.add('done');r.querySelector('.out').disabled=true;
    const d=Math.abs(s.m-10),txt=s.m>12?'乾き不足：熱圧でパンクしやすい':s.m<8?'乾きすぎ：割れや接着不良の原因に':'ちょうどいい！';
    msg.textContent=`${s.n}を取り出し：含水率 ${s.m.toFixed(1)}%（${txt}）`;beep(d<=2?880:400,.12,'triangle');
    if(S.every(x=>x.out))finish()};
  rows.forEach((r,k)=>r.querySelector('.out').onclick=()=>take(k));
  const key=e=>{const k={Digit1:0,Digit2:1,Digit3:2,Numpad1:0,Numpad2:1,Numpad3:2}[e.code];if(k!=null&&!e.repeat){e.preventDefault();take(k)}};
  addEventListener('keydown',key);addCleanup(()=>removeEventListener('keydown',key));
  loop(dt=>{if(fin)return false;t+=dt;const set=+temp.value;tv.textContent=set;T+=(set-T)*Math.min(1,dt*.6);ta.textContent=Math.round(T);
    S.forEach((s,k)=>{if(s.out)return;
      // 後半（含水率25%以下）は水分が抜けにくくなる
      const slow=s.m>25?1:.7+.3*s.m/25;
      s.m=Math.max(0,s.m-(T-90)*.06*cf.dryRate*s.rate*slow*dt);
      // 乾いてきた（含水率30%以下）単板を高温にさらすと割れやすい
      if(T>CT&&s.m<30)s.crack=Math.min(1,s.crack+(T-CT)/15*.18*dt);
      const r=rows[k];r.querySelector('.mo').textContent=s.m.toFixed(1)+'%';r.querySelector('.mo').className='num mo'+(s.m>=8&&s.m<=12?' good':s.m<8?' over':'');
      r.querySelector('.mf').style.width=(s.m/M0*100)+'%';r.querySelector('.risk').style.width=s.crack*100+'%';
      if(s.m<=0)take(k)});
    const live=S.filter(s=>!s.out),avg=live.length?live.reduce((a,s)=>a+s.m,0)/live.length:10;
    sheet.style.background=`hsl(34,50%,${32+(M0-avg)/M0*42}%)`});
  function finish(){if(fin)return;fin=true;
    const acc=S.reduce((a,s)=>a+Math.max(0,100-Math.abs(s.m-10)*20),0)/S.length;
    const tEnd=Math.max(...S.map(s=>s.t)),sp=clamp((ref*1.25-tEnd)/(ref*.25),0,1)*25,pen=S.reduce((a,s)=>a+s.crack,0)/S.length*45;
    // 熱圧の工程には、いちばん問題のある単板の含水率を引き継ぐ
    const worst=S.reduce((a,s)=>Math.abs(s.m-10)>Math.abs(a.m-10)?s:a);G.moisture=worst.m>12||worst.m<8?worst.m:S.reduce((a,s)=>a+s.m,0)/S.length;
    done(acc*.75+sp-pen,`含水率 ${S.map(s=>`${s.n} ${s.m.toFixed(1)}%`).join('・')}・時間 ${tEnd.toFixed(1)}秒${pen>2?`・割れ発生 -${Math.round(pen)}点`:''}`)}
}

function playSort(area,done){
  // 選別ライン：コンベアで流れてくる単板を、流れ切る前に仕分ける。穴はタップでパッチ補修してから心板へ
  const cf=V(),types=shuffle([...cf.sortMix]),N=types.length;
  const BIN={A:'表板',B:'心板',F:'燃料行き'},want=t=>t==='A'?'A':t==='R'?'F':'B';
  const WHY={A:'欠点のない単板は、見える面の表板（裏板）に使います。',B:'小さな節は強さへの影響が小さく、内側の心板に回せます。',
    H:'穴はパッチで補修すれば、心板として使えます。',R:'大きな割れや腐れのある単板は合板に使えないので、チップやボイラーの燃料として活用します。'};
  area.innerHTML=`<div class="hud"><span class="cnt"></span><span class="cb"></span></div>
  <div class="line"><div class="endzone">◀ ここまでに仕分け</div></div>
  <div class="sort-btns"><button data-g="A">✨ 表板<br><small>欠点なし</small><kbd>1</kbd></button>
    <button data-g="B">🟤 心板<br><small>小さな節・補修済み</small><kbd>2</kbd></button>
    <button data-g="F">🔥 燃料行き<br><small>大きな割れ・腐れ</small><kbd>3</kbd></button></div>
  <div class="msg">光っている単板（いちばん左）が仕分けの対象です。穴は🩹タップで補修してから心板へ！色の濃淡は欠点ではありません。</div>`;
  const g=s=>area.querySelector(s),line=g('.line'),cnt=g('.cnt'),cb=g('.cb'),msg=g('.msg');
  const R=(a,b)=>a+Math.random()*(b-a);
  // 室内用（smallKnot）は節が小さく数も少ないので、見落としやすい
  const knot=()=>cf.smallKnot?`<i class="knot" style="left:${R(8,85)}%;top:${R(12,75)}%;width:${R(8,11)}px;height:${R(6,9)}px"></i>`
    :`<i class="knot" style="left:${R(8,85)}%;top:${R(12,75)}%;width:${R(12,18)}px;height:${R(9,13)}px"></i>`;
  const tone=()=>`<i class="tone" style="top:${R(5,60)}%;height:${R(15,35)}%"></i>`;
  function feat(t){let h=Math.random()<.4?tone():'';
    if(t==='B')for(let k=0,n=(cf.smallKnot?1:2)+(Math.random()*(cf.smallKnot?2:2)|0);k<n;k++)h+=knot();
    if(t==='H'){h+=`<i class="hole" style="left:${R(15,70)}%;top:${R(20,55)}%"></i>`;if(Math.random()<.4)h+=knot()}
    if(t==='R'){h+=`<i class="crack" style="left:${R(3,15)}%;top:${R(25,70)}%;width:${R(65,85)}%;transform:rotate(${R(-3,3)}deg)"></i>`;
      if(Math.random()<.6)h+=`<i class="rot" style="left:${R(10,60)}%;top:${R(10,45)}%"></i>`}
    return h}
  const sheets=[];let spawned=0,fin=0,ok=0,combo=0,maxCombo=0,next=0,t=0,gap=cf.gap,end=false;
  const upd=()=>{cnt.textContent=`仕分け ${fin} / ${N}枚`;cb.textContent=combo>=2?`🔥 ${combo}コンボ！`:`最大コンボ ${maxCombo}`};upd();
  function spawn(){const type=types[spawned++],el=document.createElement('div');el.className='vsheet';
    el.innerHTML=`<div class="veneer">${feat(type)}</div><div class="judge"></div>`;line.appendChild(el);
    const s={el,type,x:100,patched:false,live:true};sheets.push(s);
    const hole=el.querySelector('.hole');
    if(hole)hole.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!s.live||s.patched)return;
      s.patched=true;hole.className='patch';beep(700,.08,'triangle');msg.textContent='🩹 パッチで穴を補修！ 補修した単板は心板として使えます。'})}
  const target=()=>sheets.find(s=>s.live);
  function judge(s,bin){s.live=false;fin++;let pts=0,txt;const w=want(s.type);
    if(bin===null)txt=`⏰ 見逃し！ 正しくは「${BIN[w]}」。${WHY[s.type]}`;
    else if(s.type==='H'){if(bin==='B'&&s.patched){pts=1;txt='⭕ 補修してから心板へ。完ぺき！'}
      else if(bin==='B'){pts=.5;txt='△ 心板でOK。でも穴をパッチで補修してから使おう！'}
      else if(bin==='A')txt='❌ 穴のある単板は表板にできません。補修して心板へ。';else txt='❌ もったいない！穴はパッチで補修すれば使えます。'}
    else if(bin===w){pts=1;txt='⭕ '+WHY[s.type]}else txt=`❌ 正しくは「${BIN[w]}」。${WHY[s.type]}`;
    ok+=pts;if(pts===1){combo++;maxCombo=Math.max(maxCombo,combo)}else combo=0;
    const j=s.el.querySelector('.judge');j.textContent=pts===1?'⭕':pts?'△':'❌';j.style.color=pts===1?'var(--ok)':pts?'var(--warn)':'var(--ng)';
    s.el.classList.add('target','to-'+(bin||'miss'));setTimeout(()=>s.el.remove(),650);
    msg.textContent=txt;beep(pts===1?880+Math.min(combo,8)*40:pts?500:200,.1,pts?'triangle':'square',pts?.05:.03);upd();
    if(fin>=N&&!end){end=true;setTimeout(()=>done(ok/N*90+Math.min(10,maxCombo/N*10),`正解 ${Math.round(ok*10)/10} / ${N}枚・最大コンボ ${maxCombo}`),500)}}
  const sortTo=bin=>{const s=target();if(s&&!end)judge(s,bin)};
  area.querySelectorAll('.sort-btns button').forEach(b=>b.onclick=()=>sortTo(b.dataset.g));
  const key=e=>{const m={Digit1:'A',Digit2:'B',Digit3:'F',Numpad1:'A',Numpad2:'B',Numpad3:'F'}[e.code];if(m&&!e.repeat){e.preventDefault();sortTo(m)}};
  addEventListener('keydown',key);addCleanup(()=>removeEventListener('keydown',key));
  loop(dt=>{t+=dt;
    if(spawned<N&&t>=next){spawn();next=t+gap;gap=Math.max(1.3,gap*.95)}
    for(const s of sheets)if(s.live){s.x-=cf.belt*dt;s.el.style.left=s.x+'%';if(s.x<-1)judge(s,null)}
    const tg=target();for(const s of sheets)if(s.live)s.el.classList.toggle('target',s===tg);
    if(end)return false});
}

function playLayup(area,done){
  const n=G.order.ply,names=n===3?['表板','心板','裏板']:['表板','添心板','心板','添心板','裏板'];
  const want=names.map((_,k)=>k%2?'v':'h'),wantGlue=names.map((_,k)=>k%2),glue=names.map(()=>0);
  let dirs;do{dirs=want.map(()=>Math.random()<.5?'h':'v')}while(dirs.filter((d,k)=>d===want[k]).length>n-2);
  let sel=null;
  area.innerHTML=`<div class="osheet">📋 注文：<b>${G.order.name}</b>（${G.order.spec}）<br>使い道：${G.order.use}</div>
  <div class="hud"><span class="tm"></span><span>${n}枚（奇数枚）で組み立て</span></div><div class="lys"></div>
  <div class="msg">ルール ① となりあう単板は木目を直角に交差させる ② 表板・裏板の木目は「⟷」向き ③ 接着剤は${n===3?'心板（2層目）':'添心板（2層目・4層目）'}の両面に塗る（グルースプレッダー）</div>
  <h3>🧴 接着剤を選ぶ（使い道に合った接着性能は？）</h3>
  <div class="glues">${GLUES.map((g,k)=>`<button data-k="${k}"><b>${g.cls}向け：${g.name}</b><small>${g.note}</small></button>`).join('')}</div>
  <button class="big act">✅ 重ねてプレスへ送る</button>`;
  const lys=area.querySelector('.lys'),tm=area.querySelector('.tm');
  function render(){lys.innerHTML=names.map((nm,k)=>`<div class="layer"><span class="ln">${k+1}層目<br><small>${nm}</small></span>
    <div class="strip ${dirs[k]}${glue[k]?' glued':''}"><span>木目 ${dirs[k]==='h'?'⟷':'↕'}${glue[k]?'　🧴のり':''}</span></div>
    <button data-r="${k}">↻ 向き</button><button data-g="${k}" class="${glue[k]?'on':''}">🧴 のり</button></div>`).join('');
    lys.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const k=+b.dataset.r;dirs[k]=dirs[k]==='h'?'v':'h';beep(520,.05);render()});
    lys.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const k=+b.dataset.g;glue[k]^=1;beep(420,.05);render()})}
  render();
  area.querySelectorAll('.glues button').forEach(b=>b.onclick=()=>{sel=GLUES[+b.dataset.k];area.querySelectorAll('.glues button').forEach(x=>x.classList.toggle('on',x===b));beep(600,.05)});
  let t=V().layTime,end=false;
  const finish=()=>{if(end)return;end=true;
    const a=dirs.filter((d,k)=>d===want[k]).length,b=glue.filter((g,k)=>g===wantGlue[k]).length;
    G.dirsOK=a===n;G.glueOK=b===n;G.glue=sel;
    const need=GRANK[G.order.glue],have=sel?GRANK[sel.cls]:0;
    const gp=have===need?30:have>need?18:0;
    const gtxt=!sel?'接着剤未選択':have===need?`接着剤 ${sel.cls}（ぴったり）`:have>need?`接着剤 ${sel.cls}（性能は足りるがオーバースペック）`:`接着剤 ${sel.cls}（性能不足！）`;
    // 答え合わせ：自分の組み方と正解を、ゲームと同じ絵で並べて表示
    const row=(k,d,gl,mark)=>`<div class="arow"><span class="ln">${k+1}層目<br><small>${names[k]}</small></span>
      <div class="strip ${d}${gl?' glued':''}"><span>${d==='h'?'⟷':'↕'}${gl?' 🧴':''}</span></div>${mark==null?'':`<b>${mark?'⭕':'❌'}</b>`}</div>`;
    const right=GLUES.find(g=>g.cls===G.order.glue);
    lys.style.display='none';
    lys.insertAdjacentHTML('afterend',`<div class="answer"><h3>📐 答え合わせ</h3><div class="ans-grid">
      <div><b>あなたの組み方</b>${names.map((_,k)=>row(k,dirs[k],glue[k],dirs[k]===want[k]&&glue[k]===wantGlue[k])).join('')}</div>
      <div><b>正解</b>${names.map((_,k)=>row(k,want[k],wantGlue[k],null)).join('')}</div></div>
      <p>🧴 接着剤　あなた：<b>${sel?`${sel.cls}（${sel.name}）`:'未選択'}</b> ${have===need?'⭕':'❌'}　／　正解：<b>${right.cls}（${right.name}）</b></p>
      <p class="note">木目を直角に交差させ、表板・裏板は⟷向き。接着剤は${n===3?'心板':'添心板'}の両面に塗ります。</p></div>`);
    done(a/n*40+b/n*30+gp,`木目の向き ${a}/${n}・のり付け ${b}/${n}・${gtxt}`)};
  area.querySelector('.act').onclick=finish;
  loop(dt=>{t-=dt;tm.textContent=`残り ${Math.max(0,t).toFixed(1)}秒`;if(t<=0){finish();return false}});
}

function playPress(area,done){
  // 圧力カーブをなぞる：加圧 → 保圧 → 減圧①② の目標カーブに、油圧レバーで圧力を合わせ続ける。
  // 減圧が速すぎると板の中の水蒸気が一気に噴き出してパンクする
  const cf=V(),wet=G.moisture!=null&&G.moisture>12,PM=1.5,BAND=.08;
  const segs=[];let t0=0;const add=(d,p0,p1,name)=>{segs.push({t0,t1:t0+d,p0,p1,name});t0+=d};
  add(1.2,0,0,'準備');add(2,0,1,'加圧');add(cf.pressNeed,1,1,'保圧');add(1.2,1,.45,'減圧①');add(wet?5:3,.45,0,'減圧②（ガス抜き）');
  const TT=t0,seg=t=>segs.find(s=>t<s.t1)||segs[segs.length-1],target=t=>{const s=seg(t);return s.p0+(s.p1-s.p0)*clamp((t-s.t0)/(s.t1-s.t0),0,1)};
  area.innerHTML=`<div class="hud"><span class="ph"></span><span class="pv"></span><span class="cp"></span></div>
  <canvas class="cv pcv" width="640" height="280"></canvas>
  <div class="pbtns"><button class="dn">▼ 下げる</button><button class="up">▲ 上げる</button></div>
  <div class="msg">${wet?`⚠ 単板の含水率が ${G.moisture.toFixed(1)}% と高め！ 板の中の水蒸気が多いので、最後のガス抜きを長く・ゆっくりにする必要があります。<br>`:''}画面を上下になぞる（または▲▼ボタン・↑↓キー）と油圧レバーが動きます。オレンジの線を緑の帯に合わせ続けよう！</div>`;
  const cv=area.querySelector('canvas'),ctx=cv.getContext('2d'),W=640,H=280,g=s=>area.querySelector(s),ph=g('.ph'),pv=g('.pv'),cp=g('.cp'),msg=g('.msg');
  const X=t=>40+t/TT*(W-60),Y=p=>H-24-p/PM*(H-54);
  let lever=0,p=0,t=0,inB=0,pank=0,crush=0,cool=0,flash=0,flashTxt='',nextDip=4+Math.random()*2,up=false,down=false,drag=false;const trace=[];
  const fromY=e=>{const r=cv.getBoundingClientRect();lever=clamp((H-24-(e.clientY-r.top)*H/r.height)/(H-54)*PM,0,PM)};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();drag=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}fromY(e)});
  cv.addEventListener('pointermove',e=>{if(drag)fromY(e)});['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>drag=false));
  const hold=(sel,set)=>{const b=g(sel);b.addEventListener('pointerdown',e=>{e.preventDefault();set(true)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>set(false)));b.addEventListener('contextmenu',e=>e.preventDefault())};
  hold('.up',v=>up=v);hold('.dn',v=>down=v);
  const kd=e=>{if(e.code==='ArrowUp'){e.preventDefault();up=true}if(e.code==='ArrowDown'){e.preventDefault();down=true}},
        ku=e=>{if(e.code==='ArrowUp')up=false;if(e.code==='ArrowDown')down=false};
  addEventListener('keydown',kd);addEventListener('keyup',ku);addCleanup(()=>{removeEventListener('keydown',kd);removeEventListener('keyup',ku)});
  loop(dt=>{t+=dt;const s=seg(t),tg=target(t);
    if(up)lever=Math.min(PM,lever+.7*dt);if(down)lever=Math.max(0,lever-.7*dt);
    // 油圧はレバーに少し遅れて追いつく。保圧中はときどき油圧が下がる
    p+=(lever-p)*Math.min(1,dt*3.2);
    if(s.name==='保圧'){p-=.02*cf.leak*dt;if(t>nextDip){p=Math.max(0,p-.18*cf.leak);nextDip=t+1.4+Math.random()*1.6;flash=.8;flashTxt='⚠ 油圧が下がった！';beep(160,.1,'square',.03)}}
    const ok=Math.abs(p-tg)<=BAND;if(ok)inB+=dt;
    cool-=dt;flash-=dt;
    if(s.name.startsWith('減圧')&&p<tg-.14&&cool<=0){pank++;cool=1;flash=1;flashTxt='💥 パンク！ 圧力を抜くのが速すぎて、水蒸気が噴き出した';beep(110,.35,'sawtooth',.06)}
    if(p>1.25){crush+=dt;if(flash<=0){flash=.3;flashTxt='⚠ 圧力が強すぎ！板がつぶれて薄くなる'}}
    trace.push([t,p]);
    // 描画
    ctx.fillStyle='#2b2420';ctx.fillRect(0,0,W,H);ctx.font='12px sans-serif';
    ctx.strokeStyle='rgba(255,255,255,.08)';ctx.fillStyle='rgba(255,255,255,.45)';
    for(let q=0;q<=PM+.01;q+=.5){ctx.beginPath();ctx.moveTo(40,Y(q));ctx.lineTo(W-20,Y(q));ctx.stroke();ctx.fillText(q.toFixed(1),8,Y(q)+4)}
    ctx.fillText('MPa',8,14);
    for(const sg of segs){ctx.strokeStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.moveTo(X(sg.t1),20);ctx.lineTo(X(sg.t1),H-24);ctx.stroke();
      if(sg.name!=='準備'){ctx.fillStyle=sg===s?'#ffd34d':'rgba(255,255,255,.5)';ctx.fillText(sg.name,X(sg.t0)+3,H-8)}}
    ctx.fillStyle='rgba(90,190,100,.28)';ctx.beginPath();
    for(let x=0;x<=TT;x+=.05)ctx.lineTo(X(x),Y(target(x)+BAND));for(let x=TT;x>=0;x-=.05)ctx.lineTo(X(x),Y(Math.max(0,target(x)-BAND)));ctx.fill();
    ctx.setLineDash([5,4]);ctx.strokeStyle='#7fd18b';ctx.lineWidth=1.5;ctx.beginPath();for(let x=0;x<=TT;x+=.05)ctx.lineTo(X(x),Y(target(x)));ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='#ff9a3c';ctx.lineWidth=3;ctx.beginPath();trace.forEach(([a,b],k)=>k?ctx.lineTo(X(a),Y(b)):ctx.moveTo(X(a),Y(b)));ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(X(t),20);ctx.lineTo(X(t),H-24);ctx.stroke();
    ctx.fillStyle=ok?'#7fd18b':'#ff6b5a';ctx.beginPath();ctx.arc(X(t),Y(p),6,0,7);ctx.fill();
    ctx.fillStyle='#ccc';ctx.fillRect(W-14,Y(lever)-3,10,6);ctx.fillText('レバー',W-56,Y(lever)+4);
    if(flash>0){ctx.fillStyle='#ffcf5a';ctx.font='bold 17px sans-serif';ctx.fillText(flashTxt,50,40)}
    ph.textContent=`工程：${s.name}`;pv.textContent=`圧力 ${p.toFixed(2)} MPa`;cp.textContent=`板の中心 ${Math.round(Math.min(110,20+Math.max(0,t-1.2)*14))}℃`;
    if(t>=TT){const sc=inB/TT*100-pank*20-Math.min(20,crush*8);
      done(sc,`目標どおりの圧力：${Math.round(inB/TT*100)}%${pank?`・パンク ${pank}回`:''}${crush>.2?'・圧力オーバーあり':''}`);return false}});
}

// 仕上げ・検査：パネルの中から不良を見つけてタップする
const DEFECTS={
  pank:{name:'パンク（膨れ）',why:'含水率の高い単板を熱圧すると、水分が蒸気になって膨れます。'},
  peel:{name:'はく離',why:'接着剤の塗りむらや圧力不足で、層がはがれた状態です。'},
  crack:{name:'割れ',why:'乾かしすぎや急な高温で単板が割れたものです。'},
  hole:{name:'節抜け',why:'節が抜け落ちた穴。補修（パッチ）が必要です。'},
  chip:{name:'角欠け',why:'トリミングや運搬のときに角が欠けたものです。'},
  rough:{name:'研磨むら',why:'サンダーが当たらず、表面がざらついたまま残っています。'},
};
// 割れ：木目に沿って走るギザギザの割れ目（中央が太く端が細い、小さな枝分かれつき）
function crackSVG(){const W=64,H=20,n=16,pts=[];let y=10;
  for(let k=0;k<=n;k++){y=clamp(y+(Math.random()-.5)*2.4,5,15);pts.push([2+k*(W-4)/n,y])}
  const w=k=>1.6*Math.sin(Math.PI*k/n)+.12;
  const top=pts.map((p,k)=>`${p[0].toFixed(1)},${(p[1]-w(k)).toFixed(1)}`),bot=pts.map((p,k)=>`${p[0].toFixed(1)},${(p[1]+w(k)).toFixed(1)}`).reverse();
  const b=pts[4+(Math.random()*8|0)],s=Math.random()<.5?-1:1;
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts.map(p=>`${p[0].toFixed(1)},${(p[1]+1.6).toFixed(1)}`).join(' ')}" fill="none" stroke="rgba(255,244,220,.7)" stroke-width=".9"/>
    <polygon points="${top.join(' ')} ${bot.join(' ')}" fill="#2a170a"/><path d="M${b[0].toFixed(1)} ${b[1].toFixed(1)} q3 ${s*1.5} ${5+Math.random()*3} ${s*(3+Math.random()*2)}" stroke="#3b2210" stroke-width=".7" fill="none" stroke-linecap="round"/></svg>`}
// 角欠け：角が不規則に割れ、下の層（木目が直交した単板）とささくれた断面が見える
let chipId=0;
function chipSVG(){const S=36,id='cg'+(++chipId),a=26+Math.random()*6,b=22+Math.random()*7;
  const edge=(sa,sb,j)=>{const p=[],bul=.15+Math.random()*.25;for(let k=0;k<=8;k++){const t=k/8,bx=Math.sin(t*Math.PI)*bul*sa,by=Math.sin(t*Math.PI)*bul*sb;
      p.push([sa*(1-t)+bx+(k%8?(Math.random()-.5)*j:0),sb*t+by+(k%8?(Math.random()-.5)*j:0)])}p[0][1]=0;p[8][0]=0;return p};
  const outer=edge(a,b,4),inner=edge(a*.55,b*.55,3),pts=p=>p.map(q=>`${Math.max(0,q[0]).toFixed(1)},${Math.max(0,q[1]).toFixed(1)}`).join(' ');
  const ticks=outer.slice(1,8).map(q=>`M${q[0].toFixed(1)} ${q[1].toFixed(1)} l${(1+Math.random()*2).toFixed(1)} ${(1+Math.random()*2).toFixed(1)}`).join(' ');
  return`<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"><defs><pattern id="${id}" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#d3a062"/><rect width="1" height="3" fill="#b07a3e"/></pattern></defs>
    <polygon points="0,0 ${pts(outer)}" fill="url(#${id})"/><polyline points="${pts(outer)}" fill="none" stroke="#7a4f24" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="${ticks}" stroke="#8a5a2b" stroke-width=".7" stroke-linecap="round"/><polyline points="${outer.map(q=>`${(q[0]+1.2).toFixed(1)},${(q[1]+1.2).toFixed(1)}`).join(' ')}" fill="none" stroke="rgba(255,244,220,.6)" stroke-width=".7"/>
    <polygon points="0,0 ${pts(inner)}" style="fill:var(--card)"/><polyline points="${pts(inner)}" fill="none" stroke="#5e3b1a" stroke-width=".9"/></svg>`}
function playInspect(area,done){
  // 出荷前検査：合板が1枚ずつ流れてくる。不良をタップで指摘してから「合格／不合格」を判定する
  const cf=V(),P=cf.inspPanels,D=cf.inspN,PT=cf.inspTime;
  // 前の工程の結果に応じて、起きやすい不良を必ず混ぜる
  const must=[];if(G.moisture!=null&&G.moisture>12)must.push('pank');if(G.glueOK===false||G.scores[6]<60)must.push('peel');
  if(G.moisture!=null&&G.moisture<8)must.push('crack');
  const kinds=[...new Set([...must,...shuffle(Object.keys(DEFECTS).filter(k=>!must.includes(k)))])];
  const list=shuffle(Array.from({length:D},(_,k)=>kinds[k%kinds.length]));
  // 不良を合板に振り分ける（不良のない合板がまざることもある）
  const good=Math.random()<.65?Math.random()*P|0:-1,panels=Array.from({length:P},()=>[]);
  list.forEach(k=>{let p;do{p=Math.random()*P|0}while(p===good);
    if(k==='chip'&&panels[p].includes('chip'))k='rough';panels[p].push(k)});
  area.innerHTML=`<div class="hud"><span class="pn"></span><span class="tm"></span><span class="fd"></span></div>
  <div class="ipanel"></div>
  <div class="jbtns"><button class="okb">✅ 合格<br><small>不良なし</small></button><button class="ngb">❌ 不合格<br><small>不良あり</small></button></div>
  <div class="msg">不良をタップして指摘してから、合格か不合格かを判定しよう。色の濃淡や木目の流れは不良ではありません。</div>`;
  const g=s=>area.querySelector(s),pan=g('.ipanel'),pn=g('.pn'),tm=g('.tm'),fd=g('.fd'),msg=g('.msg');
  const R=(a,b)=>a+Math.random()*(b-a);
  let pi=-1,t=PT,found=0,missP=0,busy=true,end=false,sum=0,right=0,allFound=0,allMiss=0;
  const upd=()=>{fd.textContent=`指摘 ${found}か所・ミス ${missP}`};
  function show(){pi++;if(pi>=P){finish();return}
    const ds=panels[pi],spots=[];found=0;missP=0;t=PT;
    const place=k=>{if(k==='chip'){const c=pick(['tl','tr','bl','br']);spots.corner=c;return[c[1]==='l'?0:100,c[0]==='t'?0:100]}
      for(let n=0;n<60;n++){const p=[8+R(0,84),14+R(0,72)];if(spots.every(s=>Math.hypot((s[0]-p[0])*2.4,s[1]-p[1])>24))return p}return[50,50]};
    const html=ds.map((k,n)=>{const p=place(k);spots.push(p);return k==='chip'?`<div class="spot corner c-${spots.corner}" data-n="${n}"><i class="d-chip">${chipSVG()}</i></div>`:`<div class="spot" data-n="${n}" style="left:${p[0]}%;top:${p[1]}%"><i class="d-${k}">${k==='crack'?crackSVG():''}</i></div>`}).join('');
    // まぎらわしいけれど不良ではない模様（色むら・濃い木目・明るい斑点）
    const decoys=Array.from({length:3+(Math.random()*2|0)},()=>{const p=place('x');spots.push(p);
      return`<i class="decoy dk-${pick(['tone','streak','spot'])}" style="left:${p[0]}%;top:${p[1]}%"></i>`}).join('');
    pan.innerHTML=decoys+html;pan.classList.remove('in');void pan.offsetWidth;pan.classList.add('in');
    pn.textContent=`${pi+1}枚目 / ${P}枚`;upd();busy=false}
  pan.addEventListener('pointerdown',e=>{if(busy||end)return;e.preventDefault();
    const s=e.target.closest('.spot');
    if(s&&!s.classList.contains('found')){const d=DEFECTS[panels[pi][+s.dataset.n]];s.classList.add('found');found++;allFound++;
      s.insertAdjacentHTML('beforeend',`<span class="tag">${d.name}</span>`);msg.innerHTML=`⭕ 「${d.name}」を発見！ ${d.why}`;beep(880,.1,'triangle');upd();return}
    if(s)return;
    const r=pan.getBoundingClientRect();missP++;allMiss++;upd();beep(200,.12,'square',.03);
    pan.insertAdjacentHTML('beforeend',`<b class="miss" style="left:${(e.clientX-r.left)/r.width*100}%;top:${(e.clientY-r.top)/r.height*100}%">✕</b>`);
    msg.textContent=e.target.classList.contains('decoy')?'❌ それは色むら・木目の模様で、不良ではありません。':'❌ そこは問題なし！'});
  function judge(pass){if(busy)return;busy=true;const n=panels[pi].length;let sc,txt;
    if(pass===null){sc=0;txt='⏰ 時間切れ…判定できませんでした。'}
    else if(n===0){sc=pass?100:0;txt=pass?'⭕ 正しく合格！ 不良のない良品でした。':'❌ この合板に不良はありませんでした。良品をはねると材料のムダになります。'}
    else{sc=pass?0:found/n*60+40;txt=pass?`❌ 不良品を出荷してしまった！（不良 ${n}か所）`:`⭕ 不合格の判定は正解！ 不良 ${found}/${n}か所を指摘。`}
    if((pass===true&&n===0)||(pass===false&&n>0))right++;
    sc=Math.max(0,sc-missP*8);sum+=sc;
    pan.querySelectorAll('.spot:not(.found)').forEach(s=>{s.classList.add('missed');s.insertAdjacentHTML('beforeend',`<span class="tag">見逃し：${DEFECTS[panels[pi][+s.dataset.n]].name}</span>`)});
    msg.textContent=txt;beep(sc>=60?988:220,.15,sc>=60?'triangle':'square',.03);
    setTimeout(show,n&&found<n?2200:1300)}
  g('.okb').onclick=()=>judge(true);g('.ngb').onclick=()=>judge(false);
  function finish(){if(end)return;end=true;done(sum/P,`判定の正解 ${right}/${P}枚・不良の指摘 ${allFound}/${D}か所・ミスタップ ${allMiss}回`)}
  show();
  loop(dt=>{if(end)return false;if(!busy){t-=dt;if(t<=0)judge(null)}tm.textContent=`残り ${Math.max(0,t).toFixed(1)}秒`});
}
