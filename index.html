  e:'従来のレースは丸太の両端を軸でつかむため、ある程度の太さの芯が残りました。スピンドルレスレースは外周から駆動するので、直径数cmほどまで剥くことができ、スギやカラマツの間伐材など細い丸太も合板に活用できるようになりました。'},
 {c:'koutei',t:'剥き芯',y:'むきしん',d:'ロータリーレースで剥いたあとに残る芯。杭などに再利用される。',q:'ロータリーレースで剥いたあとに残る、丸太の芯の部分を何という？',a:[],
  e:'剥き芯は細くまっすぐな円柱の形をしているので、杭や土木用の資材、ガーデニング用品などに再利用されます。スピンドルレスレースの普及で、剥き芯はより細くなりました。'},
 {c:'koutei',t:'プレッシャーバー',y:'',d:'ロータリーレースで、刃の手前から木を押さえて裏割れを防ぐ部品。',q:'ロータリーレースで、刃の手前から木を押さえつけて、単板の裏割れを防ぐ部品を何という？',a:[],
  e:'刃で木を剥くと、単板の片面（裏側）に細かい割れ（裏割れ）が入りやすくなります。刃の直前をプレッシャーバーで押さえることで、割れが少なく厚さのそろった単板が剥けます。'},
 {c:'koutei',t:'スライサー',y:'',d:'角材を平らに薄く削いで、化粧用の単板をつくる機械。',q:'角材を平らに薄く削いで、美しい木目の化粧用単板をつくる機械を何という？',a:[],
  e:'スライサーでつくった単板（スライスド単板）は、柾目などの美しい木目を生かせるので、天然木化粧合板の表面や家具などに使われます。合板の材料の大部分を剥くロータリーレースとは、用途によって使い分けられています。'},
 {c:'koutei',t:'クリッパー',y:'',d:'剥いた単板を決まった幅に切り、大きな欠点を取り除く機械。',q:'剥いたばかりの単板を決まった幅に切りそろえ、大きな欠点を取り除く機械を何という？',a:[],
  e:'ロータリーレースから連続して出てくる長い単板を、決まった幅に切りそろえ、腐れや大きな割れなどの使えない部分を切り落とします。切りそろえた単板はドライヤーへ送られます。'},
 {c:'koutei',t:'ドライヤー',y:'',d:'単板を熱風などで乾かす乾燥機。',q:'単板を熱風などで連続して乾かす乾燥機を何という？',a:['単板ドライヤー'],
  e:'単板をローラーやネットで送りながら、120〜160℃くらいの熱風を当てて乾かします。単板の厚さや樹種に合わせて温度や送るスピードを調整し、含水率をおよそ10%前後にそろえます。'},
 {c:'koutei',t:'剥ぎ合わせ',y:'はぎあわせ',d:'幅の狭い単板をつなぎ合わせて、1枚の大きさにすること。つなぐ機械をコンポーザーという。',q:'幅の狭い単板を横につなぎ合わせて、1枚の大きさにすることを何という？',a:['コンポーザー'],
  e:'丸太の外側や、欠点を切り落とした部分からは幅の狭い単板が出ます。これをつなぎ合わせて1枚の大きさにすることで、原木をムダなく使えます。つなぎ合わせる機械をコンポーザーと呼びます。'},
 {c:'koutei',t:'補修（パッチ）',y:'ほしゅう',d:'単板の穴や節抜けを、埋め木などでふさぐこと。',q:'単板の穴や節抜けの部分を、健全な木片を埋めてふさぐことを何という？（カタカナで）',a:['パッチ','埋め木','うめき','補修'],
  e:'穴の部分を型で打ち抜き、同じ形の健全な木片をはめ込んでふさぎます。補修することで、欠点のある単板も捨てずに使えます。'},
 {c:'koutei',t:'グルースプレッダー',y:'',d:'ローラーで単板に接着剤を塗る機械。',q:'ローラーの間に単板を通して、接着剤を塗る機械を何という？',a:['スプレッダー'],
  e:'2本のローラーの間に単板を通すと、両面に接着剤が均一に塗られます。合板では、内側の単板の両面に接着剤を塗り、表板・裏板ではさむように重ねます。塗る量（塗布量）は、単板の状態や接着剤の種類によって調整します。'},
 {c:'koutei',t:'コールドプレス（冷圧）',y:'れいあつ',d:'熱をかけずに圧力をかけ、単板を仮接着する工程。',q:'熱をかけずに圧力をかけて、重ねた単板を仮接着する工程を何という？',a:['コールドプレス','冷圧'],
  e:'接着剤を塗って重ねた単板を、まず常温でプレスして仮接着します。こうすると単板がずれずに形が落ち着き、ホットプレスへ効率よく送り込めます。'},
 {c:'koutei',t:'ホットプレス（熱圧）',y:'ねつあつ',d:'熱した盤で熱と圧力をかけ、接着剤を固める工程。',q:'熱した盤で熱と圧力をかけ、接着剤を固める工程を何という？',a:['ホットプレス','熱圧'],
  e:'熱盤の温度はおおむね110〜140℃で、温度・圧力・時間の3つが接着の品質を決めます。厚い合板ほど中心まで熱が伝わるのに時間がかかるため、プレス時間が長くなります。'},
 {c:'koutei',t:'多段式ホットプレス',y:'ただんしき',d:'熱盤を何段も重ね、一度に何枚もの合板を熱圧するプレス機。',q:'熱盤を何段も重ね、一度に何枚もの合板を熱圧できるプレス機を何という？',a:['多段プレス','多段式プレス','多段式'],
  e:'熱盤と熱盤の間（段）ごとに合板を入れ、全段を同時に閉じて熱圧します。段数の多い大型のものでは、一度に数十枚の合板を熱圧できます。'},
 {c:'koutei',t:'保圧・減圧',y:'ほあつ・げんあつ',d:'決めた圧力を保つことを保圧、最後に圧力を段階的に下げて水蒸気を逃がすことを減圧（ガス抜き）という。',q:'熱圧の最後に、板の中にたまった水蒸気を逃がすため、圧力を段階的に下げることを何という？',a:['減圧','げんあつ','ガス抜き','がすぬき'],
  e:'熱圧中、単板や接着剤に含まれる水分は水蒸気になって板の中にたまっています。圧力を一気に抜くと水蒸気が噴き出し、板が膨れたりはがれたり（パンク）するため、段階的に減圧して少しずつ逃がします。決めた圧力を一定の時間保つことは「保圧」といいます。'},
 {c:'koutei',t:'トリミング',y:'',d:'合板の四辺を切りそろえて、決まった寸法に仕上げること。',q:'熱圧が終わった合板の四辺を切りそろえて、決まった寸法に仕上げることを何という？',a:[],
  e:'熱圧後の合板は端がそろっていないため、のこぎりで四辺を切りそろえて製品の寸法にします。玉切りのときに、このトリミング分の余裕を見込んでおきます。'},
 {c:'koutei',t:'サンダー',y:'',d:'合板の表面を研磨して、なめらかにする機械。',q:'合板の表面を研磨して、なめらかに仕上げる機械を何という？',a:[],
  e:'研磨紙（サンドペーパー）を巻いたローラーやベルトで表面を削り、厚さをそろえたり、表面をなめらかにしたりします。用途によって研磨する製品・しない製品があります。'},
 {c:'koutei',t:'歩留まり',y:'ぶどまり',d:'材料から、製品として使える部分がどれくらい得られたかの割合。',q:'原木などの材料から、製品として使える部分がどれくらい得られたかの割合を何という？',a:[],
  e:'合板づくりでは、剥皮で木部を削りすぎない、剥き芯を細くする、狭い単板も剥ぎ合わせて使う、などの工夫で歩留まりを高めています。歩留まりが高いほど、資源をムダなく使えていることになります。'},

 // ---- 木材の性質・欠点 ----
 {c:'zai',t:'単板（ベニヤ）',y:'たんぱん',d:'丸太から薄く剥いた（または削いだ）1枚の板。合板の材料。「ベニヤ板」は合板の俗称。',q:'丸太から薄く剥いたり削いだりした、合板の材料になる1枚の薄い板を何という？',a:['単板','ベニヤ'],
  e:'ロータリーレースで剥いたり、スライサーで削いだりした薄い板が単板です。英語の veneer（ベニヤ）は本来この単板を指し、日本で合板を「ベニヤ板」と呼ぶのは俗称です。単板を重ねて接着すると、合板やLVLになります。'},
 {c:'zai',t:'含水率',y:'がんすいりつ',d:'木に含まれる水分の重さを、乾いた木の重さで割った割合（%）。',q:'木に含まれる水分の重さを、水分を除いた木の重さで割った割合（%）を何という？',a:[],
  e:'含水率(%)＝（水を含んだ重さ − 全乾重量）÷ 全乾重量 × 100 で求めます。基準が「乾いた木の重さ」なので、伐ったばかりの木では100%を超えることもあります。単板はおよそ10%前後まで乾かしてから接着し、JASでは合板の含水率は14%以下と定められています。'},
 {c:'zai',t:'全乾重量',y:'ぜんかんじゅうりょう',d:'木材を乾かして水分をすべて除いたときの重さ。含水率の基準。',q:'木材を約105℃で、重さが変わらなくなるまで乾かしたときの重さ（含水率の基準になる重さ）を何という？',a:[],
  e:'含水率を計算するときの基準になる重さです。木材を乾燥機で重さが変わらなくなるまで乾かして求めます。この方法を全乾法といいます。'},
 {c:'zai',t:'平衡含水率',y:'へいこうがんすいりつ',d:'置いた場所の温度・湿度とつり合って、それ以上変化しなくなった含水率。',q:'木材を置いた場所の温度・湿度とつり合って、それ以上変化しなくなった含水率を何という？',a:[],
  e:'木材は周りの空気の湿度に合わせて、水分を吸ったり吐いたりします。日本の屋外ではおおむね15%前後で落ち着くといわれます。使う場所の平衡含水率に近い含水率で使うと、乾燥による狂いが起きにくくなります。'},
 {c:'zai',t:'異方性',y:'いほうせい',d:'方向によって強さや伸び縮みなどの性質がちがうこと。',q:'木材のように、方向によって強さや伸び縮みなどの性質がちがうことを何という？',a:[],
  e:'木材は、繊維方向（長さ方向）・半径方向・接線方向で性質が大きくちがいます。たとえば乾燥による収縮は、繊維方向がもっとも小さく、接線方向がもっとも大きくなります。合板は直交積層によって、この異方性をおさえた材料です。'},
 {c:'zai',t:'年輪',y:'ねんりん',d:'1年ごとの成長でできる、木の断面の輪の模様。',q:'木の断面に見える、1年ごとの成長でできる輪の模様を何という？',a:[],
  e:'春から夏にかけて育つ色の淡い部分（早材）と、夏から秋に育つ色の濃い部分（晩材）が1組になって、1年分の輪になります。年輪の幅から、その木が育った環境や成長の速さがわかります。'},
 {c:'zai',t:'心材（赤身）',y:'しんざい',d:'丸太の断面の中心部の、色の濃い部分。',q:'丸太の断面で、中心部の色の濃い部分を何という？',a:['心材','赤身','あかみ'],
  e:'心材は細胞が活動をやめた部分で、樹種によっては腐りにくい成分を含みます。スギの心材が赤っぽいのはよく知られた例です。外側の色の淡い部分は辺材（白太）と呼びます。'},
 {c:'zai',t:'辺材（白太）',y:'へんざい',d:'丸太の断面の外側の、色の淡い部分。',q:'丸太の断面で、樹皮に近い外側の色の淡い部分を何という？',a:['辺材','白太','しらた'],
  e:'辺材には生きた細胞が残っていて、根から吸い上げた水を運ぶ役目をしています。一般に心材より腐りやすく、虫の害も受けやすい部分です。'},
 {c:'zai',t:'板目',y:'いため',d:'年輪に接するように切ったときに出る、山形や波のような木目。',q:'丸太の中心をはずして年輪に接するように切ったとき、表面に山形や波のような木目が出る板を何という？',a:[],
  e:'板目は山形の美しい模様が出ますが、乾燥すると反りやすい性質があります。ロータリーレースで剥いた単板は、板目に近い木目になります。'},
 {c:'zai',t:'柾目',y:'まさめ',d:'丸太の中心を通るように切ったときに出る、平行でまっすぐな木目。',q:'丸太の中心を通るように切ったとき、表面に平行なまっすぐの木目が出る板を何という？',a:[],
  e:'柾目は年輪に直角に切った面で、木目がそろって見え、反りなどの狂いが少ないのが特徴です。1本の丸太からとれる量が少ないため、高級な材とされます。'},
 {c:'zai',t:'生き節',y:'いきぶし',d:'生きた枝の跡で、まわりの組織とつながっている抜けにくい節。',q:'生きた枝の跡で、まわりの木の組織としっかりつながっている節を何という？',a:[],
  e:'生き節はまわりとつながっているので抜けにくく、強さへの影響も比較的小さい節です。合板では、小さな生き節のある単板は内側の心板などに使われます。'},
 {c:'zai',t:'死に節',y:'しにぶし',d:'枯れた枝が巻き込まれてできた、まわりとつながっていない抜けやすい節。',q:'枯れた枝が幹に巻き込まれてできた、まわりの組織とつながっていない抜けやすい節を何という？',a:['死節'],
  e:'死に節はまわりとつながっていないため、乾燥や加工のときに抜け落ちて穴（節抜け）になりやすい欠点です。抜けた穴は補修（パッチ）でふさいでから使います。'},
 {c:'zai',t:'節抜け',y:'ふしぬけ',d:'単板の節が抜け落ちてできた穴。補修して使う。',q:'単板の死に節などが抜け落ちてできた穴を何という？',a:[],
  e:'節抜けがあるとその部分は強さがなく、表面の見た目も悪くなります。単板の段階で見つけて、補修（パッチ）してから使います。'},
 {c:'zai',t:'入り皮',y:'いりかわ',d:'樹皮が幹の中に巻き込まれて、材の中に残ったもの。',q:'樹皮が幹の中に巻き込まれて、材の中に残ったものを何という？',a:[],
  e:'傷ついた部分を木がおおうように成長したときなどにできます。単板に現れると、その部分は接着しにくく割れやすい欠点になります。'},
 {c:'zai',t:'腐れ',y:'くされ',d:'菌によって木材の組織が分解され、もろくなった部分。',q:'木材腐朽菌によって組織が分解され、もろくなった木材の部分を何という？',a:[],
  e:'腐れのある部分は強さがなく接着もしにくいため、クリッパーや選別で取り除きます。合板に使えない単板は、チップやボイラーの燃料として活用されます。'},
 {c:'zai',t:'裏割れ',y:'うらわれ',d:'ロータリーレースで剥いた単板の裏側にできやすい、細かい割れ。',q:'ロータリーレースで剥いた単板の片面（裏側）にできやすい、細かい割れを何という？',a:[],
  e:'単板が刃の上で急に曲げられるために生じる割れです。裏割れが多いと、接着剤がしみ込みすぎたり、表面に割れが出たりする原因になります。原木を温める（蒸煮）ことや、プレッシャーバーで押さえることで少なくできます。'},
 {c:'zai',t:'針葉樹',y:'しんようじゅ',d:'スギ・ヒノキ・カラマツなど、細くとがった葉をもつ木。日本の合板の主な原料。',q:'スギ・ヒノキ・カラマツのように、細くとがった葉をもつ木のなかまを何という？',a:[],
  e:'針葉樹はまっすぐに育ちやすく、やわらかくて加工しやすいため、建築用の材料として多く使われます。現在、国内で生産される合板の大部分は、針葉樹の単板でつくられています。'},
 {c:'zai',t:'ラワン',y:'',d:'東南アジアなどに産する広葉樹。かつて日本の合板の主な原料だった。',q:'東南アジアなどに産する広葉樹で、かつて日本の合板の主な原料として大量に使われた木材は？',a:[],
  e:'ラワンは比較的やわらかく加工しやすいため、普通合板やコンクリート型枠用合板の原料として広く使われ、「ラワン合板」と呼ばれました。資源の減少などにより、現在は国産の針葉樹への転換が進んでいます。'},

 // ---- 接着・品質・規格 ----
 {c:'setchaku',t:'直交積層',y:'ちょっこうせきそう',d:'単板の繊維方向を直角に交差させて重ねること。合板の強さの秘密。',q:'単板の繊維方向を直角に交差させて重ねることを何という？',a:[],
  e:'木は繊維方向に強く伸び縮みが小さい一方、直角方向には弱く伸び縮みが大きい性質（異方性）があります。直交させて重ねるとこの差がおたがいに打ち消され、寸法が安定し、どの方向にもある程度の強さをもつ板になります。'},
 {c:'setchaku',t:'プライ',y:'',d:'合板を構成する単板の枚数。5プライ＝5枚構成。',q:'合板を構成する単板の枚数（層の数）を表す言葉は？',a:['ply'],
  e:'3枚で構成された合板を3プライ、5枚なら5プライと呼びます。表と裏が対称になるよう奇数プライが基本で、厚い合板ほどプライ数が多くなります。'},
 {c:'setchaku',t:'表板・裏板',y:'おもていた・うらいた',d:'合板の両側の面になる単板。表板の見た目が板面の品質を決める。',q:'合板の両側の表面になる単板を何という？（どちらか一方でも正解）',a:['表板','裏板'],
  e:'合板のいちばん外側の2枚で、木目の向きは同じです。見える面になる表板の見た目（節や割れの少なさ）が、合板の板面の品質を左右します。'},
 {c:'setchaku',t:'心板',y:'しんいた',d:'合板の内側（表板と裏板の間）に使われる単板。',q:'合板の内側（表板と裏板の間）に使われる単板を何という？',a:['添心板','そえしんいた'],
  e:'3プライでは中心の1枚が心板で、木目は表板と直交します。5プライでは表板のすぐ内側の、表板と直交する単板を「添心板」と呼ぶこともあります。見えない内側なので、小さな節のある単板や補修した単板も使えます。'},
 {c:'setchaku',t:'塗布量',y:'とふりょう',d:'単板に塗る接着剤の量。',q:'単板に塗る接着剤の量のことを何という？',a:[],
  e:'少なすぎると接着不良（はく離）の原因に、多すぎると接着剤のムダや熱圧時の不具合の原因になります。単板の表面が粗いときや厚い単板では多めにします。目安として、900cm²あたり25〜35g程度とされます。'},
 {c:'setchaku',t:'硬化',y:'こうか',d:'接着剤が熱や化学反応によって固まること。',q:'接着剤が熱や化学反応によって固まることを何という？',a:[],
  e:'合板に使うフェノール樹脂・メラミン樹脂・ユリア樹脂などの接着剤は、熱を加えると化学反応が進んで固まる「熱硬化性」の接着剤です。ホットプレスの熱は、この硬化を進めるために使われます。'},
 {c:'setchaku',t:'フェノール樹脂',y:'ふぇのーるじゅし',d:'耐水性が高く、特類の合板に主に使われる接着剤。',q:'耐水性・耐久性が高く、特類の合板に主に使われる接着剤（樹脂）は？',a:['フェノール'],
  e:'フェノール樹脂接着剤は煮沸にも耐えるほど耐水性・耐久性が高く、構造用合板などに使われます。固まると赤褐色の接着層になるのも特徴です。'},
 {c:'setchaku',t:'ユリア樹脂',y:'ゆりあじゅし',d:'コストが低く、主に室内用の合板に使われる接着剤。尿素樹脂ともいう。',q:'コストが低く、主に室内用（2類）の合板に使われる接着剤（樹脂）は？',a:['ユリア','尿素樹脂','にょうそじゅし'],
  e:'ユリア（尿素）樹脂接着剤は無色に近く扱いやすい一方、耐水性は控えめです。メラミンを加えて耐水性を高めた「メラミン・ユリア共縮合樹脂接着剤」も広く使われています。'},
 {c:'setchaku',t:'特類・1類・2類',y:'とくるい',d:'JASの「接着の程度」の区分。特類＝屋外・常時湿潤、1類＝断続的に湿潤、2類＝主に室内。',q:'JASの合板の「接着の程度」で、屋外や常に湿った状態での使用を想定した、最も耐水性の高い区分は？',a:['特類'],
  e:'特類は72時間の連続煮沸に耐える性能で、主にフェノール樹脂系の接着剤が使われます。1類はくり返しの煮沸に耐える性能で断続的に湿る場所向け、2類は主に室内向けです。使う場所に合った区分を選ぶことが大切です。'},
 {c:'setchaku',t:'パンク',y:'',d:'熱圧時に単板の水分が蒸気になり、膨れたり接着がはがれたりする不良。',q:'熱圧のとき、単板の水分が水蒸気になって、合板が膨れたり接着がはがれたりする不良を何という？',a:[],
  e:'単板の含水率が高すぎる、接着剤を塗りすぎた、減圧を急ぎすぎた、などが原因になります。乾燥で含水率をそろえ、熱圧の最後に段階的に減圧することで防ぎます。'},
 {c:'setchaku',t:'はく離',y:'はくり',d:'接着剤の塗りむらや圧力不足などで、合板の層どうしがはがれる不良。',q:'接着剤の塗りむらや圧力不足などで、合板の層どうしがはがれる不良を何という？',a:['剥離'],
  e:'はく離した合板は強さが大きく落ちるため、出荷できません。接着剤の塗布量、熱圧の温度・圧力・時間などを正しく管理して防ぎます。'},
 {c:'setchaku',t:'JAS',y:'ジャス',d:'日本農林規格。合板の品質（接着の程度、含水率、寸法など）の基準を定めている。',q:'合板などの品質の基準を定めた「日本農林規格」の略称は？',a:['ジャス','日本農林規格'],
  e:'合板のJASでは、接着の程度（特類・1類・2類）、含水率、寸法、ホルムアルデヒド放散量などの基準が定められています。基準を満たして格付けを受けた製品には、JASマークを表示できます。'},
 {c:'setchaku',t:'ホルムアルデヒド',y:'',d:'接着剤などから放散されることがある化学物質。シックハウスの原因の一つ。',q:'接着剤などから放散されることがあり、シックハウス症候群の原因物質の一つとされる化学物質は？',a:[],
  e:'合板の接着剤（フェノール・メラミン・ユリア樹脂など）はホルムアルデヒドを原料としているため、わずかに放散されることがあります。現在は放散量の少ない製品が主流で、放散量はF☆☆☆☆などの区分で表示されます。'},
 {c:'setchaku',t:'F☆☆☆☆',y:'フォースター',d:'ホルムアルデヒド放散量の区分で、最も放散量が少ないもの。',q:'ホルムアルデヒドの放散量が最も少ない区分を示す表示を何という？（読み方でも可）',a:['フォースター','Fフォースター','エフフォースター','F4つ星'],
  e:'☆の数が多いほど放散量が少なく、F☆☆☆☆が最上位です。建築基準法のシックハウス対策では、F☆☆☆☆の建材は、居室の内装に使う面積の制限を受けません。'},
 {c:'setchaku',t:'シックハウス症候群',y:'しっくはうすしょうこうぐん',d:'建材などから出る化学物質によって、頭痛やめまいなどの体調不良が起こること。',q:'住宅の建材などから出る化学物質によって、頭痛やめまいなどの体調不良が起こることを何という？',a:['シックハウス'],
  e:'2003年の建築基準法の改正で、ホルムアルデヒドを放散する建材の使用制限や、24時間換気設備の設置が義務づけられました。合板もF☆☆☆☆などの表示で放散量を確認して選びます。'},

 // ---- 製品・用途 ----
 {c:'seihin',t:'合板',y:'ごうはん',d:'3枚以上の単板を、繊維方向がほぼ直角に交わるように接着した板。',q:'3枚以上の単板を、繊維方向がほぼ直角に交わるように重ねて接着した板を何という？',a:['プライウッド'],
  e:'合板は単板の木目を交互に直交させて重ねることで、木材の弱点である「方向による強さや伸び縮みのちがい（異方性）」をおさえた材料です。反りや割れが起きにくく、大きな板を安定してつくれるため、住宅の床・壁・屋根の下地や家具などに広く使われます。英語ではプライウッド（plywood）といいます。'},
 {c:'seihin',t:'構造用合板',y:'こうぞうようごうはん',d:'建物の床・壁・屋根の下地など、構造上の強さが必要な部分に使う合板。',q:'建物の床・壁・屋根の下地など、構造上の強さが必要な部分に使う合板を何という？',a:[],
  e:'JASで強さや接着の性能などが定められていて、接着の程度は特類または1類です。等級には1級と2級があります。耐力壁・床（剛床）・屋根の野地板などに使われます。'},
 {c:'seihin',t:'コンクリート型枠用合板',y:'かたわくよう',d:'コンクリートを流し込む型枠に使う合板。通称「コンパネ」。',q:'コンクリートを流し込む型枠に使う合板（通称：コンパネ）の種類名は？',a:['型枠用合板','コンパネ','型枠合板'],
  e:'コンパネはコンクリートパネルの略で、900×1800mmの大きさが一般的です。コンクリートを打つたびにはがして、くり返し使い回されます（転用）。'},
 {c:'seihin',t:'普通合板',y:'ふつうごうはん',d:'家具や内装など、一般的な用途に使う合板。',q:'家具や内装など、一般的な用途に広く使われる合板の種類を何という？',a:[],
  e:'JASでは、接着の程度（1類・2類）や板面の品質などの基準が定められています。室内で使うものが多いため、ホルムアルデヒドの放散量の少なさも大切です。'},
 {c:'seihin',t:'天然木化粧合板',y:'てんねんもくけしょうごうはん',d:'表面に美しい天然木の薄い単板を貼った合板。',q:'表面に美しい天然木の薄い単板を貼り、見た目をよくした合板を何という？',a:['化粧合板'],
  e:'スライサーで削いだ美しい木目の単板を表面に貼った合板で、家具や内装の見える部分に使われます。'},
 {c:'seihin',t:'特殊加工化粧合板',y:'とくしゅかこうけしょうごうはん',d:'表面にプリントや塗装、樹脂フィルムの貼り付けなどの加工をした合板。',q:'表面にプリントや塗装、樹脂フィルムの貼り付けなどの加工をした合板を何という？',a:[],
  e:'木目などを印刷したり、塗装や樹脂のオーバーレイで表面を保護したりした合板で、家具や内装、床材などに使われます。天然木化粧合板とともに、JASで品質の基準が定められています。'},
 {c:'seihin',t:'針葉樹合板',y:'しんようじゅごうはん',d:'スギ・カラマツ・ヒノキなど、針葉樹の単板でつくった合板。',q:'スギ・カラマツ・ヒノキなど、針葉樹の単板でつくった合板を何という？',a:[],
  e:'かつて日本の合板はラワンなどの南洋材が主な原料でしたが、資源の減少などから国産の針葉樹への転換が進み、現在は国内で生産される合板の大部分を針葉樹合板が占めています。構造用合板の多くがこれにあたります。'},
 {c:'seihin',t:'シナ合板',y:'しなごうはん',d:'表板にシナノキの単板を使った、白っぽく木目のおだやかな合板。',q:'表板にシナノキの単板を使った、白っぽく木目のおだやかな合板を何という？',a:[],
  e:'表面がなめらかで塗装しやすいため、家具や建具、棚板、DIYなどに人気があります。'},
 {c:'seihin',t:'パネコート',y:'',d:'表面を樹脂で塗装した、コンクリート型枠用合板の通称。',q:'表面を樹脂で塗装した、コンクリート型枠用合板の通称は？',a:['塗装型枠用合板'],
  e:'塗装型枠用合板とも呼ばれます。表面がなめらかなので打ち上がったコンクリートの表面がきれいになり、コンクリートがはがれやすいため、くり返し使える回数（転用回数）も増えます。'},
 {c:'seihin',t:'転用',y:'てんよう',d:'コンクリート型枠などを、くり返し使い回すこと。',q:'コンクリート型枠などを、くり返し使い回すことを何という？',a:[],
  e:'型枠用合板は、コンクリートを打つたびにはがして次の現場や階で使い回します。何回使えるかを転用回数といい、表面の塗装（パネコート）やはく離剤の使用で増やすことができます。'},
 {c:'seihin',t:'はく離剤',y:'はくりざい',d:'コンクリートが型枠にくっつかないように、型枠の表面に塗る薬剤。',q:'コンクリートが型枠にくっつかないように、型枠の表面に塗る薬剤を何という？',a:['剥離剤'],
  e:'はく離剤を塗ると型枠をきれいにはがせるようになり、コンクリートの表面も傷みにくくなります。型枠用合板をくり返し使う（転用する）ためにも欠かせません。'},
 {c:'seihin',t:'3×6判・4×8判',y:'さぶろくばん・しはちばん',d:'合板の代表的な大きさ。3×6判＝910×1820mm、4×8判＝1220×2440mm。',q:'約910mm×1820mmの合板の大きさの呼び方は？',a:['3×6判','サブロク','さぶろく','3×6','3x6','三六判','さぶろくばん'],
  e:'3尺×6尺の大きさで、住宅の柱の間隔（910mm）に合わせた、もっとも代表的なサイズです。4尺×8尺の約1220×2440mmは「4×8判（しはちばん）」と呼びます。'},
 {c:'seihin',t:'厚物合板',y:'あつものごうはん',d:'床の下地などに使う、厚さ24mmや28mmといった厚い構造用合板。',q:'床の下地などに使われる、厚さ24mmや28mmといった厚い構造用合板を何という？',a:[],
  e:'厚物合板を床梁や大引の上に直接張る「根太レス工法」では、床全体が一枚の板のように一体化し、地震などの横からの力に強い床（剛床）になります。辺に実（さね）加工をして、はめ合わせることが多いです。'},
 {c:'seihin',t:'根太レス工法',y:'ねだれすこうほう',d:'根太を使わず、厚物合板を床梁や大引の上に直接張る床の工法。',q:'根太（ねだ）を使わず、厚物合板を床梁や大引の上に直接張る床の工法を何という？',a:['根太レス'],
  e:'工程が少なく施工が早いうえ、床の剛性が高まるため、近年の木造住宅で広く採用されています。'},
 {c:'seihin',t:'剛床',y:'ごうしょう',d:'厚物合板などを張って床全体を一体化し、水平方向の力に強くした床。',q:'厚物合板などを張って床全体を一体化し、水平方向の力に強くした床を何という？',a:[],
  e:'地震や風の力を受けたとき、床がゆがみにくく、力を耐力壁へしっかり伝えられます。建物全体の耐震性を高めることにつながります。'},
 {c:'seihin',t:'実加工',y:'さねかこう',d:'板の側面に凸と凹の加工をして、はめ合わせられるようにすること。',q:'板の側面に凸と凹の加工をして、となりの板とはめ合わせられるようにすることを何という？',a:['実','さね','本実','ほんざね'],
  e:'床用の厚物合板などで使われ、板どうしの段差やすき間をおさえます。凸側を「雄実（おざね）」、凹側を「雌実（めざね）」と呼びます。'},
 {c:'seihin',t:'耐力壁',y:'たいりょくへき',d:'地震や風による横からの力に抵抗する壁。',q:'地震や風による横からの力に抵抗する壁を何という？',a:[],
  e:'柱や梁に構造用合板を釘で張りつけると、強い耐力壁になります。耐力壁の強さは「壁倍率」という数値で表されます。'},
 {c:'seihin',t:'壁倍率',y:'かべばいりつ',d:'耐力壁の強さを表す数値。',q:'耐力壁の強さ（横からの力への抵抗の大きさ）を表す数値を何という？',a:[],
  e:'建築基準法で、壁のつくり方ごとに数値が決められています。数値が大きいほど強い壁で、建物に必要な量の耐力壁を配置するための計算に使われます。'},
 {c:'seihin',t:'野地板',y:'のじいた',d:'屋根の下地として、垂木の上に張る板。',q:'屋根の下地として、垂木（たるき）の上に張る板を何という？',a:[],
  e:'野地板の上に防水シート（ルーフィング）を敷き、その上に屋根材をふきます。構造用合板が野地板として広く使われています。'},
 {c:'seihin',t:'LVL',y:'エルブイエル',d:'単板積層材。単板の繊維方向をそろえて重ねた材料。梁・桁などの構造材や足場板に使われる。',q:'単板の繊維方向をそろえて（平行に）重ねて接着した材料を何という？',a:['単板積層材','たんぱんせきそうざい'],
  e:'Laminated Veneer Lumber の略です。繊維方向をそろえて重ねるので長い方向にとても強く、住宅の梁（はり）・桁（けた）・まぐさなどの構造材、工事現場の足場板、家具や建具の芯材などに使われます。直交させる合板とは構成がちがいます。'},
 {c:'seihin',t:'集成材',y:'しゅうせいざい',d:'ひき板（ラミナ）を、繊維方向をそろえて接着した木材。',q:'ひき板（ラミナ）を、繊維方向をそろえて重ねて接着した木材を何という？',a:[],
  e:'大きな節や割れを取り除いたラミナを接着するので強さが安定し、大きな断面や長い部材もつくれます。柱や梁などの構造材に使われます。単板ではなく、厚いひき板を使う点が合板やLVLとのちがいです。'},
 {c:'seihin',t:'ラミナ',y:'',d:'集成材やCLTを構成する、ひき板。',q:'集成材やCLTを構成する、ひき板のことを何という？',a:[],
  e:'丸太をのこぎりで挽いた板を乾燥させ、節や割れなどの欠点を取り除いたものです。強さを測って等級分けし、集成材の外側には強いラミナを使うなどの工夫がされます。'},
 {c:'seihin',t:'CLT',y:'シーエルティー',d:'ひき板を並べた層を、直交するように重ねて接着した大判の厚いパネル。直交集成板。',q:'ひき板を並べた層を、繊維方向が直交するように重ねて接着した、大判の厚いパネルを何という？',a:['直交集成板','ちょっこうしゅうせいばん'],
  e:'Cross Laminated Timber の略で、日本語では直交集成板といいます。合板と同じく直交に重ねるので寸法が安定し、壁や床そのものとして中高層の木造建築にも使われます。合板との大きなちがいは、単板ではなく厚いひき板を使う点です。'},
 {c:'seihin',t:'OSB',y:'オーエスビー',d:'細長い削片（ストランド）の向きをそろえて重ね、接着・熱圧した面材。',q:'木材を薄く細長く削った削片（ストランド）の向きをそろえて重ね、接着・熱圧した面材を何という？',a:['配向性ストランドボード'],
  e:'Oriented Strand Board の略です。細い木なども原料にでき、構造用の床・壁・屋根の下地として、合板と同じような用途に使われます。表面にストランドの模様が見えるのが特徴です。'},
 {c:'seihin',t:'パーティクルボード',y:'',d:'木材の小片（チップ）に接着剤を加え、熱圧して板にしたもの。',q:'木材を細かく砕いた小片（チップ）に接着剤を加え、熱圧して板にしたものを何という？',a:[],
  e:'建物の解体材や工場の端材なども原料にでき、資源のリサイクルに役立ちます。家具や床の下地などに使われます。'},
 {c:'seihin',t:'MDF',y:'エムディーエフ',d:'木材を繊維状にほぐし、接着剤を加えて成形した中密度の繊維板。',q:'木材を繊維状にほぐし、接着剤を加えて板状に成形した中密度の繊維板を何という？',a:['中密度繊維板'],
  e:'Medium Density Fiberboard の略です。表面が均質でなめらかなので塗装や加工がしやすく、家具や建具、内装材の芯材などに使われます。'},

 // ---- 環境・制度 ----
 {c:'kankyo',t:'炭素貯蔵',y:'たんそちょぞう',d:'木材が、成長するときに吸収した二酸化炭素を炭素として蓄えていること。',q:'木材が、成長するときに吸収した二酸化炭素を、炭素として蓄えている働きを何という？',a:['炭素固定','炭素の貯蔵'],
  e:'木材を建物などで長く使うことは、炭素を長い期間たくわえておくことにつながります。伐ったあとに植林して森林を育てれば、ふたたび二酸化炭素が吸収されるため、木材は持続可能な資源とされています。'},
 {c:'kankyo',t:'間伐材',y:'かんばつざい',d:'森林を健全に育てるために、混み合った木を間引いたときに出る木材。',q:'森林を健全に育てるために、混み合った木を間引いたときに出る木材を何という？',a:[],
  e:'間伐をすると残った木に日光が当たって太く育ち、森林が健全になります。間伐材は細いものが多いですが、スピンドルレスレースの普及などで、合板の原料としても活用されています。'},
 {c:'kankyo',t:'クリーンウッド法',y:'',d:'合法に伐採された木材の流通と利用を促進するための法律の通称。',q:'合法に伐採された木材の流通と利用を促進するための法律の通称は？',a:[],
  e:'正式名称は「合法伐採木材等の流通及び利用の促進に関する法律」で、2017年に施行されました。違法に伐採された木材を使わないことで、世界の森林を守ることを目的としています。'},
 {c:'kankyo',t:'森林認証',y:'しんりんにんしょう',d:'適切に管理された森林からの木材であることを、第三者が審査して証明する制度。',q:'適切に管理された森林から生産された木材であることを、第三者機関が審査して証明する制度を何という？',a:[],
  e:'代表的なものに、FSC、PEFC、日本のSGECなどがあります。認証を受けた木材を使った製品には、認証マークが表示されます。'},
];
const GLOSSARY=WORDS; // 互換用
// 答え合わせ用：カタカナ→ひらがな、全角英数→半角、記号や空白をそろえる
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96))
  .replace(/[\s・()（）「」、。]/g,'').replace(/[☆★*]/g,'☆').replace(/[x×]/g,'×');
function answers(w){const s=new Set([w.t,w.t.replace(/（.*?）/g,''),...(w.t.match(/（(.*?)）/g)||[]).map(x=>x.slice(1,-1)),...w.t.split('・'),...w.a]);
  if(w.y){s.add(w.y);w.y.split('・').forEach(x=>s.add(x))}return new Set([...s].filter(Boolean).map(norm))}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card">${html}</div>`;
  m.onclick=e=>{if(e.target===m)m.remove()};document.querySelectorAll('.modal').forEach(x=>x.remove());document.body.appendChild(m);return m}
function showGlossary(){
  const m=modal(`<h2>📖 合板の用語集 <small class="note">${WORDS.length}語</small></h2>
    <button class="gbtn wt">📝 単語テストに挑戦</button>
    <input class="gq" placeholder="キーワードで絞り込み（例：接着、乾燥）"><div class="gl"></div><button class="big cl">閉じる</button>`);
  const gl=m.querySelector('.gl'),inp=m.querySelector('.gq');
  const render=()=>{const q=inp.value.trim();
    gl.innerHTML=Object.entries(WCAT).map(([c,name])=>{const ws=WORDS.filter(w=>w.c===c&&(!q||[w.t,w.y,w.d,w.e].join(' ').includes(q)));
      return ws.length?`<h3>${name}</h3><dl>${ws.map(w=>`<dt>${w.t}${w.y?`<small>${w.y}</small>`:''}</dt><dd>${w.d}</dd>`).join('')}</dl>`:''}).join('')||'<p>見つかりませんでした</p>'};
  inp.oninput=render;inp.addEventListener('keydown',e=>e.stopPropagation());render();
  m.querySelector('.cl').onclick=()=>m.remove();m.querySelector('.wt').onclick=showWordTest;
}
// 単語テスト（一問一答）：答えを入力して答え合わせ、または答えを見て自分で⭕❌をつける
function showWordTest(){
  const m=modal(`<h2>📝 合板の単語テスト</h2><p>一問一答形式です。問題を読んで答えを入力し「答え合わせ」。わからないときは「答えを見る」で確認して、自分で⭕／❌をつけよう。どの問題にも詳しい解説がつきます。</p>
    <h3>分野</h3><div class="wsel cats"><button class="on" data-c="all">すべて</button>${Object.entries(WCAT).map(([c,n])=>`<button data-c="${c}">${n}</button>`).join('')}</div>
    <h3>問題数</h3><div class="wsel nums"><button class="on" data-n="10">10問</button><button data-n="20">20問</button><button data-n="0">全問</button></div>
    <button class="big go">スタート！</button><button class="big sub cl">閉じる</button>`);
  let cat='all',num=10;
  m.querySelectorAll('.cats button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;m.querySelectorAll('.cats button').forEach(x=>x.classList.toggle('on',x===b))});
  m.querySelectorAll('.nums button').forEach(b=>b.onclick=()=>{num=+b.dataset.n;m.querySelectorAll('.nums button').forEach(x=>x.classList.toggle('on',x===b))});
  m.querySelector('.cl').onclick=()=>m.remove();
  m.querySelector('.go').onclick=()=>{const pool=shuffle(WORDS.filter(w=>cat==='all'||w.c===cat));runWordTest(num?pool.slice(0,num):pool)};
}
function runWordTest(list){
  const m=modal('<div class="wt-body"></div>'),body=m.querySelector('.wt-body'),res=[];let i=0;
  function ask(){const w=list[i];
    body.innerHTML=`<div class="hud"><span>Q${i+1} / ${list.length}</span><span class="note">${WCAT[w.c]}</span></div>
      <div class="wq">${w.q}</div>
      <input class="wa" placeholder="答えを入力（ひらがな・カタカナどちらでもOK）" autocomplete="off">
      <div class="wbtns"><button class="big chk">答え合わせ</button><button class="big sub see">答えを見る</button></div>
      <div class="wr"></div><button class="gbtn quit">テストをやめる</button>`;
    const inp=body.querySelector('.wa');setTimeout(()=>inp.focus(),50);inp.addEventListener('keydown',e=>e.stopPropagation());
    const reveal=typed=>{const ok=typed!=null&&answers(w).has(norm(typed));
      body.querySelector('.wbtns').remove();inp.disabled=true;
      body.querySelector('.wr').innerHTML=`<div class="wres ${typed==null?'':ok?'ok':'ng'}">
        ${typed==null?'':ok?'⭕ 正解！':`❌ ざんねん…（あなたの答え：${typed.replace(/[<>&]/g,'')||'未入力'}）`}
        <div class="wans">正解：<b>${w.t}</b>${w.y?`（${w.y}）`:''}</div></div>
        <div class="fact"><b>📖 くわしい解説</b><p>${w.e}</p></div>
        ${typed==null||!ok?`<div class="wbtns">${typed==null?'<button class="big self-ok">⭕ わかった</button>':'<button class="big sub self-ok">同じ意味なので⭕にする</button>'}<button class="big ${typed==null?'sub ':''}self-ng">${typed==null?'❌ わからなかった':'次へ ▶'}</button></div>`
          :'<button class="big nx">次へ ▶</button>'}`;
      const next=r=>{res.push({w,ok:r});beep(r?880:300,.1,'triangle');i++;i<list.length?ask():finish()};
      if(ok){beep(988,.12,'triangle');body.querySelector('.nx').onclick=()=>next(true)}
      else{body.querySelector('.self-ok').onclick=()=>next(true);body.querySelector('.self-ng').onclick=()=>next(false)}};
    body.querySelector('.chk').onclick=()=>reveal(inp.value.trim());
    body.querySelector('.see').onclick=()=>reveal(null);
    inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing&&!inp.disabled)reveal(inp.value.trim())};
    body.querySelector('.quit').onclick=()=>res.length?finish():m.remove()}
  function finish(){const ok=res.filter(r=>r.ok).length,ng=res.filter(r=>!r.ok);
    const rate=Math.round(ok/res.length*100),msg=rate===100?'💯 全問正解！ 合板博士です！':rate>=80?'🎉 すばらしい！':rate>=50?'👍 その調子！':'📖 用語集で復習してみよう';
    body.innerHTML=`<h2>📝 結果</h2><div class="rank">${ok} / ${res.length}</div><div class="title-rank">正答率 ${rate}%　${msg}</div>
      ${ng.length?`<h3>まちがえた・わからなかった用語</h3>${ng.map(r=>`<div class="review"><b>${r.w.t}</b>${r.w.y?`（${r.w.y}）`:''}<br>${r.w.d}</div>`).join('')}`:''}
      ${ng.length?'<button class="big again-ng">まちがえた問題だけ再テスト</button>':''}<button class="big sub again">別の問題でもう一度</button><button class="big sub cl">閉じる</button>`;
    if(ng.length)body.querySelector('.again-ng').onclick=()=>runWordTest(shuffle(ng.map(r=>r.w)));
    body.querySelector('.again').onclick=showWordTest;body.querySelector('.cl').onclick=()=>m.remove()}
  ask();
}
document.getElementById('gloss').onclick=showGlossary;

/* ===== 画面遷移 ===== */
let cur=-1;
const best=()=>{try{return+localStorage.getItem('plywood-best')||0}catch(e){return 0}};
const saveBest=v=>{try{if(v>best())localStorage.setItem('plywood-best',v)}catch(e){}};

function renderSteps(){
  const sc=G?G.scores:[];
  stepsEl.innerHTML=STAGES.map((s,i)=>`<span class="step ${sc[i]!=null?'done':i===cur?'now':''}">${s.icon}<small>${s.name}</small></span>`).join('');
  totalEl.textContent=G&&cur>=0?`技能 ${sc.reduce((a,b)=>a+(b||0),0)}点・知識 ${G.quiz.filter(q=>q.ok).length}/${G.quiz.length}問`:'';
}
function showTitle(){
  runCleanups();cur=-1;G=null;renderSteps();
  screen.innerHTML=`<section class="card"><h2>ようこそ、合板工場へ！</h2>
  <p>1本の丸太が「合板（ごうはん）」になるまでの工程を、ミニゲームとクイズで体験しよう。各工程は100点満点の<b>技能点</b>と、確認クイズの<b>知識点</b>で評価されます。最後に、つくった合板の<b>製品検査</b>があります。</p>
  <h3>🏭 合板ができるまで</h3>
  <div class="flow">${STAGES.map((s,i)=>`<span>${i+1}. ${s.icon} ${s.name}</span>`).join('')}</div>
  <p class="note">※実際には、クリッパー（単板の切断）・剥ぎ合わせ・コールドプレス（仮接着）・検査などの工程もあり、各工程の解説で紹介します。</p>
  <h3>📋 注文を選んでスタート</h3>
  <div class="orders">${ORDERS.map((o,k)=>`<button class="order" data-k="${k}"><b>${o.icon} ${o.name}</b><small>${o.spec}</small><small>使い道：${o.use}</small></button>`).join('')}
  <button class="order" data-k="r"><b>🎲 おまかせ</b><small>注文をランダムに選びます</small></button></div>
  <h3>📖 合板の知識を深める</h3><div class="wbtns"><button class="big sub" id="tg">📖 用語集（${WORDS.length}語）</button><button class="big sub" id="tt">📝 単語テスト</button></div>
  ${best()?`<p style="text-align:center">🏆 ベストスコア：${best()} 点</p>`:''}</section>`;
  document.getElementById("tg").onclick=showGlossary;document.getElementById("tt").onclick=showWordTest;
  screen.querySelectorAll('.order').forEach(b=>b.onclick=()=>{G=newGame(b.dataset.k==='r'?pick(ORDERS):ORDERS[+b.dataset.k]);showIntro(0)});
}
function showIntro(i){
  runCleanups();cur=i;renderSteps();const s=STAGES[i];
  screen.innerHTML=`<section class="card"><div class="stage-no">工程 ${i+1} / ${STAGES.length}　｜　注文：${G.order.icon} ${G.order.name}</div>
  <h2>${s.icon} ${s.name}<span class="yomi">${s.yomi}</span></h2>
  <div class="fact"><b>🏭 実際の工場では</b><p>${s.fact}</p></div>
  <div class="how"><b>🎮 あそびかた</b><p>${s.how}</p></div>
  <div class="osheet"><b>📋 今回の注文（${G.order.icon} ${G.order.name}）ならでは</b><br>${V().notes[i]}</div>
  <button class="big" id="go">スタート！</button></section>`;
  document.getElementById('go').onclick=()=>startStage(i);
}
function startStage(i){
  const s=STAGES[i];
  screen.innerHTML=`<section class="card"><h2>${s.icon} ${s.name}</h2><div id="area"></div></section>`;
  const area=document.getElementById('area');let fin=false;
  // スタート直後に3秒のカウントダウンをはさむ
  const count=n=>area.innerHTML=`<div class="count"><small>準備して…</small><b>${n}</b></div>`;
  count(3);beep(520,.1,'triangle');
  setTimeout(()=>{count(2);beep(520,.1,'triangle')},1000);
  setTimeout(()=>{count(1);beep(520,.1,'triangle')},2000);
  setTimeout(()=>{beep(880,.15,'triangle');
    s.play(area,(sc,note)=>{if(fin)return;fin=true;runCleanups();finishStage(i,area,Math.round(clamp(sc,0,100)),note)})},3000);
}
function finishStage(i,area,sc,note){
  G.scores[i]=sc;renderSteps();area.querySelectorAll('button,input').forEach(b=>b.disabled=true);
  const s=STAGES[i],stars=sc>=90?3:sc>=65?2:sc>=35?1:0,word=['もう一歩！','まずまず！','いい腕前！','職人技！'][stars];
  const Q=pick(QUIZ[i][G.order.id]),opts=shuffle(Q.c.map((c,k)=>({c,ok:k===0})));
  area.insertAdjacentHTML('beforeend',`<div class="result"><div class="head"><div>${word}</div><div class="sc">${sc} 点</div>
    <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div>${note}</div></div>
    <div class="pts"><b>📌 ここがポイント</b><ul>${s.points.map(p=>`<li>${p}</li>`).join('')}</ul></div>
    <div class="quiz"><b>🧠 確認クイズ</b><p>${Q.q}</p><div class="choices">${opts.map((o,k)=>`<button data-k="${k}">${o.c}</button>`).join('')}</div><div class="exp"></div></div>
    <div class="nextwrap"></div></div>`);
  beep(stars>=2?1046:600,.2,'triangle');
  const res=area.querySelector('.result');res.scrollIntoView({behavior:'smooth',block:'start'});
  const btns=[...res.querySelectorAll('.choices button')];
  btns.forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.k];btns.forEach((x,k)=>{x.disabled=true;if(opts[k].ok)x.classList.add('right')});
    if(!o.ok)b.classList.add('wrong');
    G.quiz.push({stage:s.name,q:Q.q,a:Q.c[0],e:Q.e,ok:o.ok});renderSteps();beep(o.ok?988:220,.15,o.ok?'triangle':'square',.03);
    res.querySelector('.exp').innerHTML=`${o.ok?'⭕ 正解！':'❌ ざんねん…'} ${Q.e}`;
    const last=i===STAGES.length-1;
    res.querySelector('.nextwrap').innerHTML=`<button class="big" id="next">${last?'📦 製品検査へ':'次の工程へ ▶'}</button>`;
    const nx=document.getElementById('next');nx.scrollIntoView({behavior:'smooth',block:'center'});
    nx.onclick=()=>last?showFinal():showIntro(i+1);
  });
}
function inspect(){
  const s=G.scores,o=G.order,m=G.moisture,L=[];
  const add=(st,item,txt)=>L.push({st,item,txt});
  add(s[0]>=60?'ok':'warn','寸法（玉切り）',s[0]>=60?'製品の寸法を十分に確保':'長さのばらつきが大きく、寸法不足や材料ロスの恐れ');
  add(s[2]>=60?'ok':'warn','単板の厚さ',s[2]>=60?`目標（約${o.vt}mm）に近い厚さで剥けた`:'厚さのムラが大きく、合板の厚さ・強さがばらつく恐れ');
  add(m>=8&&m<=12?'ok':m>=6&&m<=14?'warn':'ng','単板の含水率',`${m.toFixed(1)}%（目安 10%前後）${m>12?'：乾き不足でパンクの危険':m<8?'：乾きすぎで割れ・接着不良の恐れ':''}`);
  add(s[4]>=75?'ok':'warn','表板の品質',s[4]>=75?'欠点のない単板を表面に使えた':'表面に節や割れが混じり、見た目の品質が下がった');
  add(G.dirsOK?'ok':'ng','構成（直交積層）',G.dirsOK?'木目が正しく直交している':'木目の向きに誤りあり：反りや強度不足の原因に');
  const need=GRANK[o.glue],have=G.glue?GRANK[G.glue.cls]:0;
  add(have===need?'ok':have>need?'warn':'ng','接着の性能',!G.glue?`接着剤が選ばれていない（必要：${o.glue}）`:have===need?`${G.glue.cls}：使い道にぴったり`:have>need?`${G.glue.cls}：性能は十分だが、必要な${o.glue}よりオーバースペックでコスト高`:`${G.glue.cls}：必要な${o.glue}に足りず、使用中にはがれる恐れ`);
  add(G.glueOK&&s[6]>=60?'ok':s[6]>=40?'warn':'ng','接着（熱圧）',!G.glueOK?'接着剤の塗り忘れ・塗りすぎがあった':s[6]>=60?'しっかり接着できた':'接着が不十分な部分がある');
  add(s[7]>=70?'ok':'warn','出荷前検査',s[7]>=70?'不良を見逃さずに検査できた':'不良の見逃しがあり、不良品が出荷される恐れ');
  return L;
}
function showFinal(){
  runCleanups();cur=STAGES.length;renderSteps();
  const total=G.scores.reduce((a,b)=>a+b,0),qok=G.quiz.filter(q=>q.ok).length,grand=total+qok*25;saveBest(grand);

  const [vc,vt]=ng?['v-ng','❌ 不合格（作り直し）']:warn?['v-warn','⚠ 条件付き合格']:['v-ok','✅ 合格！出荷できます'];
  const [rank,title]=grand>=850?['S','伝説の合板マイスター']:grand>=700?['A','一人前の合板職人']:grand>=550?['B','頼れる見習い職人']:grand>=400?['C','新人オペレーター']:['D','工場見学者'];
  const icon={ok:'✅',warn:'⚠️',ng:'❌'};
  const missed=G.quiz.filter(q=>!q.ok);
  screen.innerHTML=`<section class="card"><h2>📦 製品検査</h2>
  <div class="osheet">注文：<b>${G.order.icon} ${G.order.name}</b><br>${G.order.spec}<br>使い道：${G.order.use}<br>必要な接着の性能：<b>${G.order.glue}</b></div>
  <div class="ply">${'<div></div>'.repeat(G.order.ply)}</div>
  <div class="verdict ${vc}">${vt}</div>
  <table>${L.map(l=>`<tr><td>${icon[l.st]}</td><td><b>${l.item}</b><br>${l.txt}</td></tr>`).join('')}</table>
  <p class="note">※ゲーム用に簡略化した判定です。実際の品質基準はJAS（日本農林規格）などで定められています。</p>
  <h3>🏅 職人ランク</h3>
  <div class="rank">${rank}</div><div class="title-rank">称号：${title}</div>
  <p style="text-align:center;margin:0">技能 <b>${total}</b>/800 ＋ 知識 <b>${qok}</b>/${G.quiz.length}問（×25点）＝ <b>${grand}</b> 点<br>🏆 ベスト ${best()} 点</p>
  <table>${STAGES.map((s,i)=>`<tr><td>${s.icon} ${s.name}</td><td class="b"><div class="mini"><div style="width:${G.scores[i]}%"></div></div></td><td style="text-align:right">${G.scores[i]}点 ${G.quiz[i]?(G.quiz[i].ok?'⭕':'❌'):''}</td></tr>`).join('')}</table>
  ${missed.length?`<h3>📝 復習しよう（まちがえたクイズ）</h3>${missed.map(q=>`<div class="review"><b>${q.stage}：${q.q}</b><br>正解：${q.a}<br>${q.e}</div>`).join('')}`:'<h3>💯 クイズ全問正解！</h3>'}
  <p class="note">クイズは注文ごとに別の問題が用意されています。別の注文で再挑戦すると、ちがう問題に出会えます。</p>
  <button class="big" id="again">🔁 別の注文でもう一度つくる</button></section>`;
  document.getElementById('again').onclick=showTitle;
}
showTitle();
